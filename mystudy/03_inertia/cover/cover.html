<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>cover</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;background:#0A1120;overflow:hidden}
.c{position:relative;width:1920px;height:1080px;overflow:hidden;color:#fff;font-family:"Noto Serif CJK SC","Noto Serif SC",serif}
canvas{position:absolute;left:0;top:0}
.kick{position:absolute;left:290px;top:120px;font-family:"Noto Sans CJK SC",sans-serif;font-weight:700;font-size:50px;color:#FF5577;letter-spacing:.14em}
.h{position:absolute;left:280px;top:190px;font-weight:900;font-size:120px;line-height:1.2;color:#EEF3FA}
.h b{color:#FFC857;text-shadow:0 0 36px rgba(255,200,87,.55)}
.f{position:absolute;left:1100px;top:930px;font-size:64px;color:#FF5577;font-style:italic;font-weight:700}
.tag{position:absolute;left:290px;top:930px;font-family:"Noto Sans CJK SC",sans-serif;font-weight:700;font-size:48px;color:#8597B0}
</style></head><body><div class="c">
<canvas id="cv" width="1920" height="1080"></canvas>
<div class="kick">惯性力</div>
<div class="h">急刹车时，<br><b>是谁推了你？</b></div>
<div class="f">F = −mα</div>
<div class="tag">X物理</div>
</div>
<script>
const W=1920,H=1080,g=document.getElementById('cv').getContext('2d');
g.fillStyle='#0A1120';g.fillRect(0,0,W,H);
let r=g.createRadialGradient(1300,640,60,1300,640,900);r.addColorStop(0,'rgba(40,80,150,.45)');r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,W,H);
// 速度线
g.strokeStyle='rgba(169,188,211,.25)';g.lineWidth=4;for(let k=0;k<7;k++){g.beginPath();g.moveTo(120+k*30,560+k*40);g.lineTo(560+k*20,560+k*40);g.stroke()}
// 车
const bx=640,by=520,bw=1120,bh=320;
g.fillStyle='#2F6FB0';g.strokeStyle='#9CC7F0';g.lineWidth=4;g.beginPath();g.roundRect(bx,by,bw,bh,36);g.fill();g.stroke();
for(let k=0;k<5;k++){g.fillStyle='rgba(160,215,255,.22)';g.strokeStyle='rgba(200,230,255,.6)';g.lineWidth=2;g.beginPath();g.roundRect(bx+40+k*(bw-80)/5,by+32,(bw-80)/5-22,120,10);g.fill();g.stroke()}
[bx+160,bx+bw-180].forEach(cx=>{g.fillStyle='#1B1F2A';g.beginPath();g.arc(cx,by+bh,46,0,7);g.fill();g.fillStyle='#8A97AD';g.beginPath();g.arc(cx,by+bh,20,0,7);g.fill()});
g.strokeStyle='#5A6B85';g.lineWidth=5;g.beginPath();g.moveTo(560,by+bh+46);g.lineTo(W,by+bh+46);g.stroke();
// 乘客（前倾）
const px=1180,py=by+bh-20,sc=1.5;g.save();g.translate(px,py);g.rotate(.42);g.lineCap='round';
g.strokeStyle='#24324D';g.lineWidth=14*sc;g.beginPath();g.moveTo(-12*sc,-70*sc);g.lineTo(-13*sc,-4*sc);g.moveTo(12*sc,-70*sc);g.lineTo(13*sc,-4*sc);g.stroke();
g.fillStyle='#3D8BFF';g.beginPath();g.roundRect(-31*sc,-150*sc,62*sc,84*sc,14*sc);g.fill();
g.strokeStyle='#F2C9A0';g.lineWidth=10*sc;g.beginPath();g.moveTo(-28*sc,-140*sc);g.lineTo(-40*sc,-90*sc);g.moveTo(28*sc,-140*sc);g.lineTo(55*sc,-110*sc);g.stroke();
g.fillStyle='#F2C9A0';g.beginPath();g.arc(0,-180*sc,30*sc,0,7);g.fill();g.fillStyle='#2E2A28';g.beginPath();g.arc(0,-185*sc,31*sc,Math.PI*1.02,Math.PI*1.98);g.fill();
g.fillStyle='#1B1F2A';[-1,1].forEach(s=>{g.beginPath();g.arc(s*11*sc,-178*sc,4*sc,0,7);g.fill()});g.strokeStyle='#7A3B2E';g.lineWidth=3*sc;g.beginPath();g.arc(0,-164*sc,4*sc,0,7);g.stroke();
g.restore();
// 红色惯性力箭头 + 问号
function arr(x1,y1,x2,y2,c,lw){g.strokeStyle=c;g.fillStyle=c;g.lineWidth=lw;g.shadowColor=c;g.shadowBlur=24;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2-30,y2);g.stroke();g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-44,y2-24);g.lineTo(x2-44,y2+24);g.closePath();g.fill();g.shadowBlur=0}
arr(1290,640,1590,640,'#FF5577',12);
g.font='900 170px "Noto Sans CJK SC"';g.fillStyle='#FFC857';g.shadowColor='rgba(255,200,87,.6)';g.shadowBlur=30;g.fillText("?",1630,700);g.shadowBlur=0;
</script></body></html>
