<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>cover</title>
<!-- 玻尔兹曼 cover: his photo (grey + warm brown, gold frame) left/top; two hook lines; the real engraving "S = k log W" from his tomb as a plaque. #w 1920x1080, #f 1440x1080, #v 1080x1440 -->
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#1b1b1b;overflow:hidden}
.c{position:relative;overflow:hidden;color:#fff;font-family:"Noto Serif SC","Noto Serif CJK SC",serif}
canvas{position:absolute;left:0;top:0}
.t{position:absolute;font-weight:900;line-height:1.1;letter-spacing:.02em;white-space:nowrap;color:#f6f2ea;text-shadow:0 3px 18px rgba(0,0,0,.85)}
.t b{font-weight:900;color:#ffd98a;text-shadow:0 3px 18px rgba(0,0,0,.85),0 0 30px rgba(255,210,130,.6)}
.w .c{width:1920px;height:1080px}
.w .t{left:880px;font-size:150px}.w .a1{top:100px}.w .a2{top:268px}
.f .c{width:1440px;height:1080px}
.f .t{left:716px;font-size:92px}.f .a1{top:110px}.f .a2{top:232px}
.v .c{width:1080px;height:1440px}
.v .t{left:0;right:0;text-align:center;font-size:120px}.v .a1{top:720px}.v .a2{top:858px}
</style></head><body><div class="c">
<canvas id="cv"></canvas>
<div class="t a1">他的墓碑上</div>
<div class="t a2">刻着<b>熵</b>的公式</div>
</div>
<script>
var M = location.hash.replace('#', '') || 'w'; document.body.className = M;
var W = M === 'v' ? 1080 : M === 'f' ? 1440 : 1920, H = M === 'v' ? 1440 : 1080, cv = document.getElementById('cv'); cv.width = W; cv.height = H;
var g = cv.getContext('2d');
var bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#1b1b1b'); bg.addColorStop(1, '#1b1b1b'); g.fillStyle = bg; g.fillRect(0, 0, W, H);
var PH = M === 'v' ? 600 : M === 'f' ? 700 : 900, PW = Math.round(PH * 474 / 580), PX = M === 'v' ? Math.round((W - PW) / 2) : M === 'f' ? 70 : 90, PY = M === 'v' ? 50 : (M === 'f' ? 110 : 90);
var gl = g.createRadialGradient(PX + PW / 2, PY + PH / 2, 60, PX + PW / 2, PY + PH / 2, Math.max(PW, PH) * 1.3); gl.addColorStop(0, 'rgba(255,170,80,0.04)'); gl.addColorStop(0.55, 'rgba(120,80,60,0.0)'); gl.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gl; g.fillRect(0, 0, W, H);
var R = (function (s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; var t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })(5);
for (var i = 0; i < 120; i++) { g.fillStyle = 'rgba(220,230,255,' + (0.1 + R() * 0.4) + ')'; g.fillRect(R() * W, R() * H, 1.5, 1.5); }
// tumbling gas molecules in the background (the "little balls")
for (var j = 0; j < 46; j++) { var bx = R() * W, by = R() * H, br = 5 + R() * 9; var bgd = g.createRadialGradient(bx - br * 0.3, by - br * 0.3, 1, bx, by, br); bgd.addColorStop(0, 'rgba(255,225,160,0.55)'); bgd.addColorStop(1, 'rgba(240,160,70,0.05)'); g.fillStyle = bgd; g.beginPath(); g.arc(bx, by, br, 0, 6.29); g.fill(); }
var imgs = [new Image(), new Image()], n = 0;
function frame(x, y, w, h) { g.save(); g.shadowColor = 'rgba(0,0,0,0.8)'; g.shadowBlur = 44; g.shadowOffsetY = 12; g.fillStyle = '#000'; g.fillRect(x - 12, y - 12, w + 24, h + 24); g.restore(); }
function gold(x, y, w, h) { g.strokeStyle = '#f0bd5c'; g.lineWidth = 6; g.shadowColor = 'rgba(240,189,92,0.6)'; g.shadowBlur = 20; g.strokeRect(x - 12, y - 12, w + 24, h + 24); g.shadowBlur = 0; }
function go() {
  if (++n < 2) return;
  frame(PX, PY, PW, PH); g.save(); g.filter = 'sepia(0.5) contrast(1.05) brightness(1.02)'; g.drawImage(imgs[0], PX, PY, PW, PH); g.restore();
  var vg = g.createLinearGradient(0, PY + PH * 0.7, 0, PY + PH); vg.addColorStop(0, 'rgba(10,8,6,0)'); vg.addColorStop(1, 'rgba(10,8,6,0.5)'); g.fillStyle = vg; g.fillRect(PX, PY, PW, PH); gold(PX, PY, PW, PH);
  g.fillStyle = '#f0bd5c'; g.font = '700 26px "DejaVu Sans Mono",monospace'; g.shadowColor = 'rgba(0,0,0,0.9)'; g.shadowBlur = 8; g.fillText('1844 – 1906', PX + 16, PY + PH - 18); g.shadowBlur = 0;
  // the engraving from his tomb
  var QW = M === 'v' ? 900 : M === 'f' ? 640 : 880, QH = Math.round(QW * 403 / 1075), QX = M === 'v' ? Math.round((W - QW) / 2) : M === 'f' ? 716 : 880, QY = M === 'v' ? 1090 : M === 'f' ? 640 : 700;
  frame(QX, QY, QW, QH); g.save(); g.filter = 'contrast(1.12) saturate(1.1)'; g.drawImage(imgs[1], QX, QY, QW, QH); g.restore(); gold(QX, QY, QW, QH);
  window.__done = true;
}
imgs[0].onload = go; imgs[1].onload = go; imgs[0].src = 'bo_photo_grey_x3.png'; imgs[1].src = 'tomb_x2.png';
</script></body></html>
