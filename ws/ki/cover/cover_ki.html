<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>cover</title>
<!-- 基尔霍夫 cover: flat #1b1b1b, gold name, two hook lines, the solar spectrum with dark Fraunhofer lines (sodium pair lit in gold). #w 1920x1080, #f 1440x1080, #v 1080x1440 -->
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#1b1b1b;overflow:hidden}
.c{position:relative;overflow:hidden;color:#fff;font-family:"Noto Serif SC","Noto Serif CJK SC",serif}
canvas{position:absolute;left:0;top:0}
.t{position:absolute;font-weight:900;line-height:1.1;letter-spacing:.02em;white-space:nowrap;color:#f6f2ea;text-shadow:0 3px 18px rgba(0,0,0,.85)}
.nm{color:#ffd98a;letter-spacing:.14em;text-shadow:0 3px 14px rgba(0,0,0,.9),0 0 28px rgba(255,200,110,.5)}
.t b{font-weight:900;color:#ffd98a;text-shadow:0 3px 18px rgba(0,0,0,.85),0 0 30px rgba(255,210,130,.6)}
.w .c{width:1920px;height:1080px}
.w .t{left:90px;font-size:150px}.w .nm{top:70px;font-size:96px}.w .a1{top:210px}.w .a2{top:392px}
.f .c{width:1440px;height:1080px}
.f .t{left:70px;font-size:104px}.f .nm{top:60px;font-size:76px}.f .a1{top:178px}.f .a2{top:306px}
.v .c{width:1080px;height:1440px}
.v .t{left:0;right:0;text-align:center;font-size:108px}.v .nm{font-size:84px;top:110px}.v .a1{top:250px}.v .a2{top:384px}
</style></head><body><div class="c">
<canvas id="cv"></canvas>
<div class="t nm">基尔霍夫</div>
<div class="t a1">他没去过太阳</div>
<div class="t a2">却知道<b>太阳里有什么</b></div>
</div>
<script>
var M = location.hash.replace('#', '') || 'w'; document.body.className = M;
var W = M === 'v' ? 1080 : M === 'f' ? 1440 : 1920, H = M === 'v' ? 1440 : 1080, cv = document.getElementById('cv'); cv.width = W; cv.height = H;
var g = cv.getContext('2d'); g.fillStyle = '#1b1b1b'; g.fillRect(0, 0, W, H);
function wl2rgb(w) { var r = 0, gg = 0, b = 0;
  if (w >= 380 && w < 440) { r = -(w - 440) / 60; b = 1; } else if (w < 490) { gg = (w - 440) / 50; b = 1; } else if (w < 510) { gg = 1; b = -(w - 510) / 20; } else if (w < 580) { r = (w - 510) / 70; gg = 1; } else if (w < 645) { r = 1; gg = -(w - 645) / 65; } else if (w <= 750) { r = 1; }
  var f = w < 420 ? 0.3 + 0.7 * (w - 380) / 40 : w > 700 ? 0.3 + 0.7 * (750 - w) / 50 : 1; return [Math.round(255 * r * f), Math.round(255 * gg * f), Math.round(255 * b * f)]; }
// strip geometry
var SX = M === 'v' ? 60 : M === 'f' ? 70 : 90, SW = W - 2 * SX, SH = M === 'v' ? 400 : M === 'f' ? 250 : 270, SY = M === 'v' ? 880 : M === 'f' ? 640 : 700;
var L0 = 400, L1 = 700; function X(w) { return SX + (w - L0) / (L1 - L0) * SW; }
g.save(); g.shadowColor = 'rgba(0,0,0,.8)'; g.shadowBlur = 40; g.shadowOffsetY = 10; g.fillStyle = '#000'; g.fillRect(SX - 10, SY - 10, SW + 20, SH + 20); g.restore();
for (var x = 0; x < SW; x++) { var w = L0 + x / SW * (L1 - L0), c = wl2rgb(w); g.fillStyle = 'rgb(' + c + ')'; g.fillRect(SX + x, SY, 1.5, SH); }
// Fraunhofer lines (approximate positions, nm; width px). schematic.
var FL = [[404, 2], [410, 3], [422.7, 2], [430.8, 4], [434, 3], [438.4, 3], [447, 2], [466, 2], [486.1, 5], [495, 2], [516.7, 4], [518.4, 4], [527, 4], [532, 2], [546, 2], [561, 2], [589.0, 0], [589.6, 0], [610, 2], [627, 3], [656.3, 6], [686.7, 5]];
var seed = 3; function R() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
for (var i = 0; i < 70; i++) FL.push([405 + R() * 290, 1 + R() * 2]);
g.fillStyle = 'rgba(8,8,8,0.88)'; FL.forEach(function (l) { if (l[1] > 0) g.fillRect(X(l[0]) - l[1] / 2 * (SW / 1500) * 1.4 - 0.5, SY, l[1] * (SW / 1500) * 1.4 + 1, SH); });
// sodium D pair: very dark, then lit gold marks above and below
var d1 = X(589.0), d2 = X(589.6); g.fillStyle = '#050505'; g.fillRect(d1 - 3.5, SY, 4.5, SH); g.fillRect(d2 + 0.5, SY, 4.5, SH);
g.save(); g.strokeStyle = '#f0bd5c'; g.lineWidth = 5; g.shadowColor = 'rgba(240,189,92,.9)'; g.shadowBlur = 18; var mx = (d1 + d2) / 2 + 1;
g.beginPath(); g.moveTo(mx, SY - 12); g.lineTo(mx, SY - 58); g.stroke(); g.beginPath(); g.moveTo(mx - 14, SY - 40); g.lineTo(mx, SY - 12); g.lineTo(mx + 14, SY - 40); g.stroke(); g.restore();
g.fillStyle = '#f0bd5c'; g.font = '900 ' + (M === 'w' ? 44 : 38) + 'px "Noto Serif CJK SC",serif'; g.textAlign = 'center'; g.shadowColor = 'rgba(0,0,0,.9)'; g.shadowBlur = 8; g.fillText('钠', mx, SY - 70);
g.strokeStyle = '#f0bd5c'; g.lineWidth = 5; g.shadowBlur = 0; g.shadowColor = 'transparent'; g.strokeRect(SX - 10, SY - 10, SW + 20, SH + 20);
window.__done = true;
</script></body></html>
