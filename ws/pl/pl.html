<script>window.TL={"end": 365.003, "groups": [{"s": 2.617, "e": 15.313, "lines": [{"t": 2.667, "st": "n", "tx": "1900 年 10 月 7 日，星期天，柏林。"}, {"t": 6.0, "st": "n", "tx": "实验家鲁本斯夫妇，到他家做客。"}, {"t": 9.333, "st": "n", "tx": "鲁本斯说起刚量到的数据："}, {"t": 12.0, "st": "n", "tx": "一个发热的物体，在长波那一头，"}]}, {"s": 15.283, "e": 23.98, "lines": [{"t": 15.333, "st": "n", "tx": "发出的光，和已有的公式对不上。"}, {"t": 18.667, "st": "n", "tx": "客人走后，主人坐下来算。"}, {"t": 21.333, "st": "n", "tx": "当晚，他写出了一个新公式，"}]}, {"s": 23.95, "e": 33.334, "lines": [{"t": 24.0, "st": "n", "tx": "寄了一张明信片给鲁本斯。"}, {"t": 26.667, "st": "n", "tx": "这张明信片，是量子时代的第一页。"}, {"t": 30.0, "st": "n", "tx": "他叫{g:普朗克}。"}]}, {"s": 37.283, "e": 46.647, "lines": [{"t": 37.333, "st": "n", "tx": "1858 年，他生在德国北部的{b:基尔}。"}, {"t": 40.667, "st": "n", "tx": "祖辈是神学教授，父亲是法学教授。"}, {"t": 44.0, "st": "n", "tx": "他钢琴和管风琴，都弹得极好。"}]}, {"s": 46.617, "e": 52.0, "lines": [{"t": 46.667, "st": "n", "tx": "在音乐和物理之间，他犹豫过。"}, {"t": 49.333, "st": "n", "tx": "最后，他选了{g:物理}。"}]}, {"s": 53.283, "e": 61.313, "lines": [{"t": 53.333, "st": "n", "tx": "在慕尼黑，物理教授约利劝他："}, {"t": 56.0, "st": "n", "tx": "这门学问，已经差不多做完了，"}, {"t": 58.667, "st": "n", "tx": "剩下的，不过是补补漏洞。"}]}, {"s": 61.283, "e": 70.647, "lines": [{"t": 61.333, "st": "n", "tx": "普朗克说，他不想发现新东西，"}, {"t": 64.0, "st": "n", "tx": "只想把已有的基础，弄得更清楚。"}, {"t": 67.333, "st": "n", "tx": "他去{b:柏林}，听亥姆霍兹和基尔霍夫讲课，"}]}, {"s": 70.617, "e": 78.001, "lines": [{"t": 70.667, "st": "n", "tx": "选了{g:热力学}。"}, {"t": 72.667, "st": "n", "tx": "基尔霍夫去世后，"}, {"t": 74.667, "st": "n", "tx": "接他位置的，就是这个学生。"}]}, {"s": 82.75, "e": 93.98, "lines": [{"t": 82.8, "st": "n", "tx": "基尔霍夫留下的问题，还在："}, {"t": 85.6, "st": "n", "tx": "一个黑体，每种颜色的光，发出多少？"}, {"t": 88.8, "st": "n", "tx": "柏林的实验家们，把它量得越来越准。"}, {"t": 92.0, "st": "n", "tx": "这条曲线，像一座山："}]}, {"s": 93.95, "e": 101.18, "lines": [{"t": 94.0, "st": "n", "tx": "短波一头低，中间有个峰，"}, {"t": 96.4, "st": "n", "tx": "长波一头，又落下去。"}, {"t": 98.4, "st": "n", "tx": "温度越高，峰越往蓝色那边移。"}]}, {"s": 101.15, "e": 108.4, "lines": [{"t": 101.2, "st": "n", "tx": "维恩写出了一个公式，"}, {"t": 103.2, "st": "n", "tx": "短波一侧，对得很好；"}, {"t": 105.2, "st": "n", "tx": "可到了长波，越来越偏。"}]}, {"s": 109.95, "e": 121.58, "lines": [{"t": 110.0, "st": "n", "tx": "长波那一头，正是{b:鲁本斯}量的。"}, {"t": 112.8, "st": "n", "tx": "他和库尔鲍姆，测的是远红外的光。"}, {"t": 116.0, "st": "n", "tx": "结果，和维恩的公式，对不上。"}, {"t": 118.8, "st": "n", "tx": "10 月 7 日那晚，普朗克坐下来，"}]}, {"s": 121.55, "e": 130.78, "lines": [{"t": 121.6, "st": "n", "tx": "凑出了一个新公式："}, {"t": 123.6, "st": "n", "tx": "短波、长波，两头都对上了。"}, {"t": 126.4, "st": "n", "tx": "几天后，鲁本斯回话："}, {"t": 128.4, "st": "n", "tx": "和他所有的测量，都吻合。"}]}, {"s": 130.75, "e": 140.0, "lines": [{"t": 130.8, "st": "n", "tx": "10 月，他在德国物理学会报告了它。"}, {"t": 134.0, "st": "n", "tx": "可这只是“凑”出来的。"}, {"t": 136.4, "st": "n", "tx": "他必须弄明白：它为什么是对的。"}]}, {"s": 141.55, "e": 151.98, "lines": [{"t": 141.6, "st": "n", "tx": "接下来的几个星期，"}, {"t": 143.6, "st": "n", "tx": "是他一生里最紧张的日子。"}, {"t": 146.0, "st": "n", "tx": "他试了所有熟悉的办法，都不行。"}, {"t": 148.8, "st": "n", "tx": "最后，他用了玻尔兹曼的统计方法。"}]}, {"s": 151.95, "e": 159.18, "lines": [{"t": 152.0, "st": "n", "tx": "要让它成立，只能加一个奇怪的假设："}, {"t": 155.2, "st": "n", "tx": "能量，不能随便取值，"}, {"t": 157.2, "st": "n", "tx": "只能{g:一份一份}地交换。"}]}, {"s": 159.15, "e": 165.98, "lines": [{"t": 159.2, "st": "n", "tx": "每一份的大小，等于一个常数，"}, {"t": 162.0, "st": "n", "tx": "乘以光的频率："}, {"t": 164.0, "st": "big", "tx": "E = hν"}]}, {"s": 165.95, "e": 176.0, "lines": [{"t": 166.0, "st": "n", "tx": "这个常数 h，小得惊人。"}, {"t": 168.4, "st": "n", "tx": "1900 年 12 月 14 日，他报告了推导。"}, {"t": 171.6, "st": "n", "tx": "很多年后，他把它叫作“{r:绝望之举}”。"}]}, {"s": 180.35, "e": 189.58, "lines": [{"t": 180.4, "st": "n", "tx": "普朗克以为，“一份一份”，"}, {"t": 183.2, "st": "n", "tx": "只是数学上的一个技巧，"}, {"t": 185.6, "st": "n", "tx": "以后会有人把它去掉。"}, {"t": 187.6, "st": "n", "tx": "他自己，花了十几年，"}]}, {"s": 189.55, "e": 199.58, "lines": [{"t": 189.6, "st": "n", "tx": "想把它改得不那么激进。"}, {"t": 192.0, "st": "n", "tx": "1905 年，一个年轻的专利员说："}, {"t": 194.8, "st": "n", "tx": "不，光本身，就是一份一份的。"}, {"t": 197.6, "st": "n", "tx": "普朗克不同意。"}]}, {"s": 199.55, "e": 210.38, "lines": [{"t": 199.6, "st": "n", "tx": "可同一年，这个年轻人写了相对论，"}, {"t": 202.8, "st": "n", "tx": "普朗克立刻看出了分量，"}, {"t": 205.2, "st": "n", "tx": "成了它最早的支持者。"}, {"t": 207.2, "st": "n", "tx": "后来，他把这个年轻人，请到了柏林。"}]}, {"s": 210.35, "e": 219.2, "lines": [{"t": 210.4, "st": "n", "tx": "他叫{g:爱因斯坦}。"}, {"t": 212.4, "st": "n", "tx": "1918 年，诺贝尔物理学奖颁给了普朗克，"}, {"t": 216.0, "st": "n", "tx": "理由是：发现了能量量子。"}]}, {"s": 225.285, "e": 237.315, "lines": [{"t": 225.335, "st": "n", "tx": "他在柏林郊外的家，是个音乐沙龙。"}, {"t": 228.669, "st": "n", "tx": "普朗克弹钢琴，爱因斯坦也是常客。"}, {"t": 232.002, "st": "n", "tx": "1909 年，妻子去世。"}, {"t": 234.002, "st": "n", "tx": "1916 年，长子卡尔，在一战中阵亡。"}]}, {"s": 237.285, "e": 247.335, "lines": [{"t": 237.335, "st": "n", "tx": "1917 年，女儿格蕾特，死于难产。"}, {"t": 240.669, "st": "n", "tx": "1919 年，她的孪生姐妹艾玛，"}, {"t": 243.335, "st": "n", "tx": "也死于难产。"}]}, {"s": 248.618, "e": 257.315, "lines": [{"t": 248.668, "st": "n", "tx": "1933 年，纳粹上台。"}, {"t": 250.668, "st": "n", "tx": "犹太科学家，一个个被赶出大学。"}, {"t": 254.002, "st": "n", "tx": "普朗克，是当时德国科学界的领袖。"}]}, {"s": 257.285, "e": 264.648, "lines": [{"t": 257.335, "st": "n", "tx": "他去见了希特勒，"}, {"t": 259.335, "st": "n", "tx": "想替犹太化学家{g:哈伯}求情。"}, {"t": 262.002, "st": "n", "tx": "希特勒大发雷霆，毫无结果。"}]}, {"s": 264.618, "e": 272.669, "lines": [{"t": 264.668, "st": "n", "tx": "他没有离开德国，"}, {"t": 266.668, "st": "n", "tx": "也没有公开反抗。"}, {"t": 268.668, "st": "n", "tx": "后人对这个选择，评价两极。"}]}, {"s": 273.952, "e": 285.316, "lines": [{"t": 274.002, "st": "n", "tx": "1944 年 2 月，他在柏林的家被炸毁，"}, {"t": 277.336, "st": "n", "tx": "许多书信和手稿，毁于大火。"}, {"t": 280.002, "st": "n", "tx": "同年 7 月，儿子{g:埃尔温}被捕，"}, {"t": 282.669, "st": "n", "tx": "他卷入了刺杀希特勒的密谋。"}]}, {"s": 285.286, "e": 297.336, "lines": [{"t": 285.336, "st": "n", "tx": "普朗克亲笔写信，求希特勒饶他一命。"}, {"t": 288.669, "st": "n", "tx": "没有回音。"}, {"t": 290.669, "st": "n", "tx": "1945 年 1 月，埃尔温被处死。"}, {"t": 293.336, "st": "n", "tx": "普朗克，八十六岁。"}]}, {"s": 298.619, "e": 307.316, "lines": [{"t": 298.669, "st": "n", "tx": "战争结束后，他住在哥廷根。"}, {"t": 301.336, "st": "n", "tx": "1947 年 10 月，他在那里去世。"}, {"t": 304.669, "st": "n", "tx": "第二年，德国最大的科研机构，"}]}, {"s": 307.286, "e": 312.669, "lines": [{"t": 307.336, "st": "n", "tx": "改以他的名字命名："}, {"t": 309.336, "st": "n", "tx": "{g:马克斯·普朗克学会}。"}]}, {"s": 318.619, "e": 329.316, "lines": [{"t": 318.669, "st": "n", "tx": "一百多年里，“一千克”到底多重，"}, {"t": 322.003, "st": "n", "tx": "由法国的一块铂铱合金圆柱说了算。"}, {"t": 325.336, "st": "n", "tx": "可它和各国的复制品，"}, {"t": 327.336, "st": "n", "tx": "质量慢慢对不上了。"}]}, {"s": 329.286, "e": 337.316, "lines": [{"t": 329.336, "st": "n", "tx": "2019 年 5 月 20 日起，"}, {"t": 332.003, "st": "n", "tx": "千克改由{b:普朗克常数}来定义："}, {"t": 334.669, "st": "n", "tx": "h 被固定为 6.62607015"}]}, {"s": 337.286, "e": 346.669, "lines": [{"t": 337.336, "st": "n", "tx": "乘以 10 的负 34 次方。"}, {"t": 340.003, "st": "n", "tx": "他当年不愿相信的那个小数，"}, {"t": 342.67, "st": "n", "tx": "成了称量世界的{g:砝码}。"}]}], "chaps": [{"s": 33.334, "e": 36.0, "word": "世家", "en": "", "line": "一个最守规矩的人。", "n": ""}, {"s": 78.4, "e": 81.2, "word": "曲线", "en": "", "line": "基尔霍夫留下的那条曲线。", "n": ""}, {"s": 176.0, "e": 178.8, "word": "不信", "en": "", "line": "一个不愿相信的人。", "n": ""}, {"s": 221.335, "e": 224.002, "word": "失去", "en": "", "line": "一个接一个，失去。", "n": ""}, {"s": 314.669, "e": 317.336, "word": "砝码", "en": "", "line": "那个他不信的小数。", "n": ""}], "crumbs": [{"t": 30.8, "zh": "人物传记 · 普朗克", "en": ""}, {"t": 33.334, "zh": "世家", "en": ""}, {"t": 78.4, "zh": "曲线", "en": ""}, {"t": 176.0, "zh": "不信", "en": ""}, {"t": 221.335, "zh": "失去", "en": ""}, {"t": 314.669, "zh": "砝码", "en": ""}, {"t": 346.669, "zh": "回顾", "en": ""}, {"t": 358.003, "zh": "资料来源", "en": ""}], "counters": [], "slams": [], "shake": [[21.833, 8], [27.167, 12], [30.4, 14], [33.684, 12], [49.833, 8], [75.167, 6], [78.75, 12], [105.7, 4], [122.1, 10], [136.9, 10], [164.5, 12], [172.1, 14], [176.35, 12], [198.1, 6], [210.9, 8], [212.9, 12], [221.685, 12], [262.602, 4], [309.836, 8], [315.019, 12], [332.503, 12], [343.17, 14], [354.302, 10]],
