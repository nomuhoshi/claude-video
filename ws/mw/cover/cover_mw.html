<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>cover</title>
<!-- 日常物理 #1 cover: a big oven window, a fork sparking; hook on the right (vertical: oven on top, hook below). #dy = vertical 1080x1440 -->
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#05060a;overflow:hidden}
.c{position:relative;overflow:hidden;color:#fff;font-family:"Noto Serif SC","Noto Serif CJK SC",serif}
canvas{position:absolute;left:0;top:0}
.h{position:absolute;font-weight:900;line-height:1.2;color:#f6f2ea;letter-spacing:.02em;text-shadow:0 3px 18px rgba(0,0,0,.8),0 0 30px rgba(200,220,255,.14)}
.h i{font-style:normal;color:#ff7a68;text-shadow:0 3px 18px rgba(0,0,0,.8),0 0 26px rgba(255,100,80,.5)}
.h b{font-weight:900;color:#ffd98a;text-shadow:0 3px 18px rgba(0,0,0,.8),0 0 28px rgba(255,210,130,.55)}
.w .c{width:1920px;height:1080px}
.w .h{left:1050px;top:350px;font-size:64px}
.w .h i{font-size:114px;display:inline-block;margin-top:10px}
.v .c{width:1080px;height:1440px}
.v .h{left:0;right:0;top:880px;text-align:center;font-size:82px}
.v .h i{font-size:140px;display:inline-block;margin-top:6px}
</style></head><body><div class="c">
<canvas id="cv"></canvas>
<div class="h">叉子、锡纸进微波炉<br>为什么<i>打火？</i></div>
</div>
<script>
var V = location.hash === '#dy'; document.body.className = V ? 'v' : 'w';
var W = V ? 1080 : 1920, H = V ? 1440 : 1080, cv = document.getElementById('cv'); cv.width = W; cv.height = H;
var g = cv.getContext('2d'), TAU = Math.PI * 2;
function rng(s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; var t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
var OX = V ? 540 : 672, OY = V ? 470 : 548;
function drawBG() {
  var b0 = g.createLinearGradient(0, 0, 0, H); b0.addColorStop(0, '#0b0e16'); b0.addColorStop(1, '#05060a'); g.fillStyle = b0; g.fillRect(0, 0, W, H);
  var wg0 = g.createRadialGradient(OX, OY, 40, OX, OY, V ? 900 : 780); wg0.addColorStop(0, 'rgba(255,140,60,0.36)'); wg0.addColorStop(0.45, 'rgba(210,90,40,0.15)'); wg0.addColorStop(1, 'rgba(120,40,20,0)'); g.fillStyle = wg0; g.fillRect(0, 0, W, H);
  var cg0 = g.createRadialGradient(V ? 540 : 1500, V ? 1150 : 600, 20, V ? 540 : 1500, V ? 1150 : 600, V ? 700 : 640); cg0.addColorStop(0, 'rgba(60,110,200,0.18)'); cg0.addColorStop(1, 'rgba(60,110,200,0)'); g.fillStyle = cg0; g.fillRect(0, 0, W, H);
  var Rb = rng(21); for (var i = 0; i < 70; i++) { var ang = Rb() * TAU, rad = (V ? 380 : 330) + Rb() * (V ? 520 : 480), px0 = OX + Math.cos(ang) * rad * (V ? 1.0 : 1.2), py0 = OY + Math.sin(ang) * rad * 0.85, sz = 1 + Rb() * 3.2, a0 = 0.25 + Rb() * 0.6;
    g.fillStyle = 'rgba(255,' + (170 + Math.floor(Rb() * 60)) + ',90,' + a0.toFixed(2) + ')'; g.shadowColor = '#ff9a40'; g.shadowBlur = 10; g.beginPath(); g.arc(px0, py0, sz, 0, TAU); g.fill(); g.shadowBlur = 0; }
}
function path(x1, y1, x2, y2, disp, seed, n) { var Rl = rng(seed), pts = [[x1, y1], [x2, y2]]; for (var k = 0; k < n; k++) { var out = [pts[0]]; for (var i = 1; i < pts.length; i++) { var a = pts[i - 1], b = pts[i]; out.push([(a[0] + b[0]) / 2 + (Rl() - 0.5) * disp, (a[1] + b[1]) / 2 + (Rl() - 0.5) * disp]); out.push(b); } pts = out; disp *= 0.55; } return pts; }
function stroke(pts, w, col, blur, a) { g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = a; g.strokeStyle = col; g.lineWidth = w; g.lineJoin = 'round'; g.lineCap = 'round'; g.shadowColor = col; g.shadowBlur = blur; g.beginPath(); pts.forEach(function (p, i) { if (i) g.lineTo(p[0], p[1]); else g.moveTo(p[0], p[1]); }); g.stroke(); g.restore(); }
function bolt(x1, y1, x2, y2, w, seed, branches) {
  var d = Math.hypot(x2 - x1, y2 - y1), main = path(x1, y1, x2, y2, d * 0.26, seed, 5);
  stroke(main, w * 5, '#ff7a2a', 28, 0.3); stroke(main, w * 2.2, '#ffb454', 12, 0.85); stroke(main, w * 0.9, '#fff8e8', 3, 1);
  var Rl = rng(seed + 99); for (var b = 0; b < (branches || 0); b++) { var i = 3 + Math.floor(Rl() * (main.length - 6)), p = main[i], ang = Math.atan2(y2 - y1, x2 - x1) + (Rl() - 0.5) * 2.0, len = d * (0.18 + 0.25 * Rl());
    var br = path(p[0], p[1], p[0] + Math.cos(ang) * len, p[1] + Math.sin(ang) * len, len * 0.3, seed + b * 7, 4); stroke(br, w * 1.6, '#ffa040', 9, 0.65); stroke(br, w * 0.6, '#fff0cc', 2.5, 0.95); }
}
function glow(x, y, r, a) { var gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(255,250,235,' + (0.95 * a).toFixed(2) + ')'); gr.addColorStop(0.18, 'rgba(255,215,140,' + (0.75 * a).toFixed(2) + ')'); gr.addColorStop(0.5, 'rgba(255,130,50,' + (0.24 * a).toFixed(2) + ')'); gr.addColorStop(1, 'rgba(255,90,30,0)'); g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r); g.restore(); }
function embers(x, y, n, spread, seed) { var Rl = rng(seed); g.save(); g.globalCompositeOperation = 'lighter'; for (var i = 0; i < n; i++) { var an = -Math.PI / 2 + (Rl() - 0.5) * 2.8, dist = spread * (0.2 + Rl()), ex = x + Math.cos(an) * dist, ey = y + Math.sin(an) * dist, l = 4 + Rl() * 12; g.strokeStyle = 'rgba(255,' + (170 + Math.floor(Rl() * 70)) + ',80,' + (0.5 + Rl() * 0.5).toFixed(2) + ')'; g.lineWidth = 1.5 + Rl() * 1.5; g.shadowColor = '#ff9a40'; g.shadowBlur = 8; g.beginPath(); g.moveTo(ex, ey); g.lineTo(ex - Math.cos(an) * l, ey - Math.sin(an) * l); g.stroke(); } g.restore(); }
function lerp2(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }
var img = new Image(), sc = document.createElement('script');
var done = 0; function ready() { if (++done < 2) return; run(); }
img.onload = ready; img.src = '3d/scene_' + (V ? 'v' : 'w') + '.png';
sc.onload = ready; sc.src = '3d/pts_' + (V ? 'v' : 'w') + '.js'; document.head.appendChild(sc);
function run() {
  var P = window.PTS, K = V ? 1.25 : 1;
  drawBG(); g.drawImage(img, 0, 0, W, H);
  // sparks, clipped to the door window
  g.save(); g.beginPath(); P.win.forEach(function (p, i) { if (i) g.lineTo(p[0], p[1]); else g.moveTo(p[0], p[1]); }); g.closePath(); g.clip();
  var T = P.tips, S = P.spikes, w = P.win;
  for (var i = 0; i < 3; i++) bolt(T[i][0], T[i][1] - 1, T[i + 1][0], T[i + 1][1] - 1, 2.0 * K, 40 + i, 1);
  var tl = lerp2(w[0], w[1], 0.16), tr = lerp2(w[0], w[1], 0.62), rr = lerp2(w[1], w[2], 0.3);
  bolt(T[0][0], T[0][1], tl[0] + 12 * K, tl[1] + 24 * K, 2.4 * K, 61, 3); bolt(T[1][0], T[1][1], tr[0], tr[1] + 8 * K, 2.2 * K, 71, 2); bolt(T[3][0], T[3][1], rr[0] - 70 * K, rr[1] - 40 * K, 2.2 * K, 81, 2);
  S.slice(0, 5).forEach(function (p, n) { var sx = p[0] > P.foilC[0] ? 1 : -1, up = p[1] < P.foilC[1] - 20 ? -1 : -0.35; bolt(p[0], p[1], p[0] + sx * (50 + 25 * (n % 3)) * K, p[1] + up * (70 + 35 * (n % 2)) * K, 1.7 * K, 120 + n * 9, 1); });
  g.restore();
  var mx = (T[0][0] + T[3][0]) / 2, my = (T[0][1] + T[3][1]) / 2;
  glow(mx, my, 62 * K, 0.5); T.forEach(function (t) { glow(t[0], t[1], 26 * K, 0.7); }); S.slice(0, 5).forEach(function (p) { glow(p[0], p[1], 38 * K, 0.75); }); glow(P.foilC[0], P.foilC[1] - 30 * K, 90 * K, 0.35);
  embers(mx, my, 24, 150 * K, 5); embers(P.foilC[0], P.foilC[1] - 40 * K, 22, 150 * K, 9);
  var vg = g.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 1.0); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.5)'); g.fillStyle = vg; g.fillRect(0, 0, W, H);
  window.__done = true;
}
</script></body></html>
