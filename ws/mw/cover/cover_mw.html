<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>cover</title>
<!-- 日常物理 #1 cover: a big oven window, a fork sparking; hook on the right (vertical: oven on top, hook below). #dy = vertical 1080x1440 -->
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#05060a;overflow:hidden}
.c{position:relative;overflow:hidden;color:#fff;font-family:"Noto Serif SC","Noto Serif CJK SC",serif}
canvas{position:absolute;left:0;top:0}
.h{position:absolute;font-weight:900;line-height:1.2;color:#f6f2ea;letter-spacing:.02em;text-shadow:0 3px 18px rgba(0,0,0,.8),0 0 30px rgba(200,220,255,.14)}
.h i{font-style:normal;color:#ff7a68;text-shadow:0 3px 18px rgba(0,0,0,.8),0 0 26px rgba(255,100,80,.5)}
.h b{font-weight:900;color:#ffd98a;text-shadow:0 3px 18px rgba(0,0,0,.8),0 0 28px rgba(255,210,130,.55)}
.w .c{width:1920px;height:1080px}
.w .h{left:985px;top:350px;font-size:70px}
.w .h i{font-size:124px;display:inline-block;margin-top:10px}
.v .c{width:1080px;height:1440px}
.v .h{left:0;right:0;top:880px;text-align:center;font-size:82px}
.v .h i{font-size:140px;display:inline-block;margin-top:6px}
</style></head><body><div class="c">
<canvas id="cv"></canvas>
<div class="h">叉子、锡纸进微波炉<br>为什么<i>打火？</i></div>
</div>
<script>
var V = location.hash === '#dy'; document.body.className = V ? 'v' : 'w';
var W = V ? 1080 : 1920, H = V ? 1440 : 1080, cv = document.getElementById('cv'); cv.width = W; cv.height = H;
var g = cv.getContext('2d'), TAU = Math.PI * 2;
function rng(s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; var t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
// background: near-black with a warm glow behind the oven (as if the sparks light the room) and a cool wash on the text side
var OX = V ? 540 : 615, OY = V ? 470 : 540;
var b0 = g.createLinearGradient(0, 0, 0, H); b0.addColorStop(0, '#0b0e16'); b0.addColorStop(1, '#05060a'); g.fillStyle = b0; g.fillRect(0, 0, W, H);
var wg0 = g.createRadialGradient(OX, OY, 40, OX, OY, V ? 900 : 760); wg0.addColorStop(0, 'rgba(255,140,60,0.34)'); wg0.addColorStop(0.45, 'rgba(210,90,40,0.14)'); wg0.addColorStop(1, 'rgba(120,40,20,0)'); g.fillStyle = wg0; g.fillRect(0, 0, W, H);
var cg0 = g.createRadialGradient(V ? 540 : 1450, V ? 1150 : 600, 20, V ? 540 : 1450, V ? 1150 : 600, V ? 700 : 620); cg0.addColorStop(0, 'rgba(60,110,200,0.18)'); cg0.addColorStop(1, 'rgba(60,110,200,0)'); g.fillStyle = cg0; g.fillRect(0, 0, W, H);
var Rb = rng(21); for (var i = 0; i < 70; i++) { var ang = Rb() * TAU, rad = (V ? 380 : 330) + Rb() * (V ? 520 : 460), px0 = OX + Math.cos(ang) * rad * (V ? 1.0 : 1.15), py0 = OY + Math.sin(ang) * rad * 0.85, sz = 1 + Rb() * 3.2; var a0 = 0.25 + Rb() * 0.6;
  g.fillStyle = 'rgba(255,' + (170 + Math.floor(Rb() * 60)) + ',90,' + a0.toFixed(2) + ')'; g.shadowColor = '#ff9a40'; g.shadowBlur = 10; g.beginPath(); g.arc(px0, py0, sz, 0, TAU); g.fill(); g.shadowBlur = 0; }
// oven
var ow = V ? 940 : 680, oh = V ? 760 : 620, cx = V ? 540 : 615, cy = V ? 470 : 540, x0 = cx - ow / 2, y0 = cy - oh / 2;
g.save(); rr(x0, y0, ow, oh, 28); var gr = g.createLinearGradient(0, y0, 0, y0 + oh); gr.addColorStop(0, '#68758f'); gr.addColorStop(1, '#2f3649'); g.fillStyle = gr; g.shadowColor = 'rgba(0,0,0,0.7)'; g.shadowBlur = 50; g.shadowOffsetY = 14; g.fill(); g.shadowBlur = 0; g.strokeStyle = 'rgba(205,220,245,0.7)'; g.lineWidth = 5; g.stroke(); g.restore();
var pw2 = ow * 0.2, wx = x0 + 34, wy = y0 + 34, ww = ow - pw2 - 34 * 2 - 10, wh = oh - 68;
g.save(); rr(wx, wy, ww, wh, 14); g.clip(); var wg = g.createLinearGradient(0, wy, 0, wy + wh); wg.addColorStop(0, '#1b2438'); wg.addColorStop(1, '#0c1322'); g.fillStyle = wg; g.fillRect(wx, wy, ww, wh);
g.fillStyle = 'rgba(130,160,200,0.3)'; g.beginPath(); g.ellipse(wx + ww / 2, wy + wh - 36, ww * 0.42, 22, 0, 0, TAU); g.fill();
// three things that spark: fork, crumpled foil, two grapes
var base = wy + wh - 44, R = rng(5);
function bolt(x1, y1, x2, y2, w) { g.save(); g.strokeStyle = '#ffe9c0'; g.lineWidth = w; g.shadowColor = '#ffb060'; g.shadowBlur = 26; g.beginPath(); g.moveTo(x1, y1); var n = 7; for (var i = 1; i < n; i++) { var u = i / n; g.lineTo(x1 + (x2 - x1) * u + (R() - 0.5) * 22, y1 + (y2 - y1) * u + (R() - 0.5) * 26); } g.lineTo(x2, y2); g.stroke(); g.strokeStyle = '#fff'; g.lineWidth = w * 0.4; g.stroke(); g.restore(); }
function flare(x, y, r) { var fl = g.createRadialGradient(x, y, 0, x, y, r); fl.addColorStop(0, 'rgba(255,255,240,0.95)'); fl.addColorStop(0.25, 'rgba(255,205,120,0.75)'); fl.addColorStop(0.6, 'rgba(255,120,60,0.3)'); fl.addColorStop(1, 'rgba(255,90,40,0)'); g.fillStyle = fl; g.fillRect(x - r, y - r, 2 * r, 2 * r); }
var u = V ? 1.0 : 0.8, FS = V ? 2.6 : 2.0, FR = V ? 130 : 92;
// fork
var fx = wx + ww * 0.27, s = FS;
g.save(); g.translate(fx, base); g.scale(s, s);
var fg = g.createLinearGradient(-24, 0, 24, 0); fg.addColorStop(0, '#7b88a2'); fg.addColorStop(0.45, '#dbe3f0'); fg.addColorStop(1, '#6d7a94'); g.fillStyle = fg; g.shadowColor = 'rgba(255,190,110,0.6)'; g.shadowBlur = 12;
g.beginPath(); g.moveTo(-6, 0); g.lineTo(-7, -105); g.lineTo(-27, -128); g.lineTo(-27, -142); g.lineTo(27, -142); g.lineTo(27, -128); g.lineTo(7, -105); g.lineTo(6, 0); g.closePath(); g.fill();
for (var i = 0; i < 4; i++) { var tx = -27 + i * 18; g.fillRect(tx, -196, 9, 58); g.beginPath(); g.moveTo(tx, -196); g.lineTo(tx + 4.5, -204); g.lineTo(tx + 9, -196); g.closePath(); g.fill(); }
g.restore();
var tip = function (i) { return [fx + (-22.5 + i * 18) * s, base - 204 * s]; };
for (var i = 0; i < 3; i++) { var a1 = tip(i), b1 = tip(i + 1); bolt(a1[0], a1[1], b1[0], b1[1], 6); }
var t0 = tip(0), t3 = tip(3); bolt(t0[0], t0[1], t0[0] - 40 * u, t0[1] - 120 * u, 5); bolt(t3[0], t3[1], t3[0] + 40 * u, t3[1] - 100 * u, 5); flare(fx, t0[1] + 10, 130 * u + 30);
// crumpled foil
var cx2 = wx + ww * 0.7, fr = FR, cy2 = base - fr * 0.75; var pts = [];
for (var i = 0; i < 15; i++) { var an = i / 15 * TAU, rr2 = fr * (0.62 + 0.5 * R()) * (i % 2 ? 1 : 0.8); pts.push([cx2 + Math.cos(an) * rr2, cy2 + Math.sin(an) * rr2 * 0.9]); }
g.save(); var fg2 = g.createLinearGradient(cx2 - fr, cy2 - fr, cx2 + fr, cy2 + fr); fg2.addColorStop(0, '#b8c2d6'); fg2.addColorStop(0.5, '#7c88a2'); fg2.addColorStop(1, '#cdd6e6'); g.fillStyle = fg2; g.strokeStyle = 'rgba(40,50,70,0.6)'; g.lineWidth = 2; g.shadowColor = 'rgba(255,190,110,0.5)'; g.shadowBlur = 12;
g.beginPath(); pts.forEach(function (p, i) { if (i) g.lineTo(p[0], p[1]); else g.moveTo(p[0], p[1]); }); g.closePath(); g.fill(); g.stroke();
g.shadowBlur = 0; for (var i = 0; i < 10; i++) { var p = pts[(i * 4) % 15], q = pts[(i * 7 + 3) % 15]; g.beginPath(); g.moveTo(p[0] * 0.5 + cx2 * 0.5, p[1] * 0.5 + cy2 * 0.5); g.lineTo(q[0] * 0.55 + cx2 * 0.45, q[1] * 0.55 + cy2 * 0.45); g.stroke(); } g.restore();
[0, 3, 6, 9, 12].forEach(function (ix, n) { var p = pts[ix]; bolt(p[0], p[1], p[0] + (p[0] > cx2 ? 1 : -1) * 36 * u, p[1] + (n % 2 ? -28 : 28) * u, 5); }); flare(cx2, cy2 - fr * 0.3, 90 * u + 24);
g.restore();
rr(wx, wy, ww, wh, 14); g.strokeStyle = 'rgba(195,212,240,0.7)'; g.lineWidth = 5; g.stroke();
// control panel
var px = wx + ww + 22, pwid = pw2 - 12; g.fillStyle = 'rgba(18,24,38,0.9)'; rr(px, wy, pwid, wh, 12); g.fill();
g.fillStyle = 'rgba(120,140,175,0.75)'; for (var i = 0; i < 5; i++) g.fillRect(px + 16, wy + 28 + i * 40, pwid - 32, 20);
g.strokeStyle = '#c9d4e6'; g.lineWidth = 5; g.beginPath(); g.arc(px + pwid / 2, wy + wh - 90, 40, 0, TAU); g.stroke(); g.beginPath(); g.moveTo(px + pwid / 2, wy + wh - 90); g.lineTo(px + pwid / 2, wy + wh - 126); g.stroke();
var vg = g.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 1.0); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.5)'); g.fillStyle = vg; g.fillRect(0, 0, W, H);
</script></body></html>
