<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#1d2538}svg{display:block}</style></head><body>
<svg id="s" width="1024" height="1024" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f2c47"/><stop offset=".55" stop-color="#6d5a63"/><stop offset="1" stop-color="#e0904f"/></linearGradient>
<radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe2a6" stop-opacity=".95"/><stop offset="1" stop-color="#ffe2a6" stop-opacity="0"/></radialGradient>
<filter id="bl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="bl2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
<clipPath id="flagclip"><path id="flagshape" d=""/></clipPath>
</defs>
<rect width="512" height="512" fill="url(#sky)"/>
<circle cx="230" cy="130" r="210" fill="url(#sun)"/>
<g id="clouds" filter="url(#bl)" opacity=".38"></g>
<g id="rays" opacity=".18"></g>
<!-- pole -->
<path d="M262 520 L304 28" stroke="#2a1d1a" stroke-width="9" stroke-linecap="round"/>
<circle cx="305" cy="24" r="9" fill="#FFD27A"/>
<!-- flag -->
<g id="flag"></g>
<!-- figure -->
<g id="fig" fill="#15111a"></g>
</svg>
<script>
const NS='http://www.w3.org/2000/svg';
function E(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||document.getElementById('s')).appendChild(e);return e}
let seed=5;function R(){seed=(seed*16807)%2147483647;return seed/2147483647}
// clouds
const C=document.getElementById('clouds');
for(let i=0;i<14;i++){E('ellipse',{cx:R()*512,cy:200+R()*260,rx:50+R()*90,ry:18+R()*34,fill:i%3?'#3a3140':'#f1b074'},C)}
// rays
const Rg=document.getElementById('rays');
for(let i=0;i<14;i++){const a=(-100+ i*14)*Math.PI/180;E('path',{d:`M230 130L${230+Math.cos(a)*520} ${130+Math.sin(a)*520}L${230+Math.cos(a+.06)*520} ${130+Math.sin(a+.06)*520}Z`,fill:'#ffe2a6'},Rg)}
// flag shape: from pole (300,44) billowing left
const ftop='M300 44 C260 30 230 70 190 54 C160 42 130 52 100 70';
const bot='C108 140 134 150 160 164 C200 186 236 150 292 176';
const shape=ftop+' '+bot+' Z';
document.getElementById('flagshape').setAttribute('d',shape);
const FG=document.getElementById('flag');
E('path',{d:shape,fill:'#C8352D'},FG);
const cl=E('g',{'clip-path':'url(#flagclip)'},FG);
// folds
[[110,.22],[150,.0],[190,.2],[235,.0],[270,.22]].forEach(([x,o],i)=>{E('path',{d:`M${x} 20 C${x+14} 70 ${x-14} 130 ${x+6} 200L${x+34} 200C${x+10} 130 ${x+36} 70 ${x+20} 20Z`,fill:i%2?'#fff':'#000',opacity:i%2?.10:.22},cl)});
E('path',{d:shape,fill:'none',stroke:'#8f1f1c','stroke-width':2.5},FG);
// diagram on flag
const D=E('g',{'clip-path':'url(#flagclip)',fill:'none',stroke:'#FFE29A','stroke-linecap':'round','stroke-linejoin':'round','stroke-width':5},FG);
const a=[222,112],b=[170,98],P1=[140,150],P2=[270,150],Q=[118,76],Q2=[130,138];
function seg(p,q){E('path',{d:`M${p[0]} ${p[1]}L${q[0]} ${q[1]}`},D)}
// simple QED diagram skewed to follow cloth
seg([268,150],[218,112]);seg([218,112],[250,64]);seg([128,64],[160,100]);seg([160,100],[134,150]);
let d='';const A=[218,112],B=[160,100];for(let i=0;i<=40;i++){const t=i/40;d+=(i?'L':'M')+(A[0]+(B[0]-A[0])*t).toFixed(1)+' '+(A[1]+(B[1]-A[1])*t+6*Math.sin(t*3*2*Math.PI)).toFixed(1)}
E('path',{d,stroke:'#FFFFFF','stroke-width':4},D);
[[218,112],[160,100]].forEach(p=>E('circle',{cx:p[0],cy:p[1],r:7,fill:'#FFE29A',stroke:'none'},D));
// figure: bust at lower right, facing left, raised arm
const G=document.getElementById('fig');
E('path',{d:'M520 520 L520 462 C480 436 430 438 400 452 C372 464 352 490 350 520Z'},G);
const hg=E('g',{transform:'translate(508 262) scale(-.4 .4)'},G);
E('path',{d:'M120 560 C132 452 150 424 140 402 C92 372 70 300 78 232 C84 142 150 90 196 74 C232 62 266 58 286 76 C300 66 330 72 346 88 C384 112 398 150 402 192 L406 226 C410 242 420 262 432 282 C440 292 450 302 446 312 C440 318 430 320 424 322 C428 332 430 338 424 344 C430 352 428 358 420 362 C424 374 420 386 404 394 C386 404 362 404 342 400 L334 424 C366 444 404 472 414 560 Z'},hg);
E('path',{d:'M86 206 C70 116 140 30 236 22 C300 18 340 30 372 28 C420 20 470 40 486 96 C490 124 470 146 446 136 C458 112 446 92 420 96 C408 126 412 190 412 232 C384 214 352 206 330 204 C250 198 170 202 86 206Z',fill:'#C8352D'},hg);
E('path',{d:'M88 206 C170 202 250 198 330 204 C352 206 382 214 410 230',fill:'none',stroke:'#8f1f1c','stroke-width':8},hg);
E('path',{d:'M330 520 C334 486 352 470 380 462 L420 470 L420 520Z'},G);
// raised arm
E('path',{d:'M424 500 C380 480 318 446 286 390',stroke:'#15111a','stroke-width':36,'stroke-linecap':'round',fill:'none'},G);
// fist gripping the pole
const f=E('g',{transform:'translate(280 360) rotate(-6) scale(.9)'},G);
E('rect',{x:-24,y:-32,width:52,height:64,rx:22,fill:'#15111a'},f);
[-34,-17,0,17].forEach(o=>E('rect',{x:-40,y:o-2+ -4,width:50,height:17,rx:8.5,fill:'#15111a',stroke:'#FFD9A0','stroke-width':3},f));
</script></body></html>
