<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>cover</title>
<style>
:root{--fg:#fff6e0;--gold:#ffc94d;--hot:#ff7a3c}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;background:#05070b;overflow:hidden}
.c{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:"Noto Sans SC","Noto Sans CJK SC",sans-serif;color:var(--fg);
 background:radial-gradient(900px 640px at 68%,rgba(255,150,50,.16),transparent 70%),#05070b}
canvas{position:absolute;left:0;top:0}
.tag{position:absolute;left:306px;top:128px}
.tag b{display:inline-block;padding:6px 26px;border:3px solid var(--gold);border-radius:8px;font:900 46px/1.25 "Noto Sans SC","Noto Sans CJK SC",sans-serif;color:var(--gold);letter-spacing:.06em;background:rgba(255,201,77,.10)}
.tag i{display:block;margin-top:0;font:500 28px/1 "IBM Plex Mono",monospace;letter-spacing:.28em;color:rgba(255,246,224,.55);font-style:normal}
.h{position:absolute;left:306px;font-family:"Noto Serif SC","Noto Serif CJK SC",serif;font-weight:900;white-space:nowrap}
.h1{top:218px;font-size:122px;line-height:1.1;color:#fff6e0;text-shadow:0 0 30px rgba(255,201,77,.25),0 4px 0 rgba(0,0,0,.6)}
.h2{top:352px;font-size:122px;line-height:1.1;color:#fff6e0;text-shadow:0 0 30px rgba(255,201,77,.25),0 4px 0 rgba(0,0,0,.6)}
.h3{top:470px;font-size:330px;line-height:1.05;color:var(--gold);letter-spacing:.02em;text-shadow:0 0 60px rgba(255,170,40,.65),0 0 14px rgba(255,120,40,.5),0 6px 0 rgba(90,40,0,.7)}
.sub{position:absolute;left:306px;top:880px;font:900 54px/1.2 "Noto Sans SC","Noto Sans CJK SC",sans-serif;color:#fff6e0;text-shadow:0 2px 0 rgba(0,0,0,.6)}
.sub em{font-style:normal;color:var(--gold)}
</style></head><body><div class="c">
<canvas id="cv" width="1920" height="1080"></canvas>

<div class="h h1">烧一块木头，</div>
<div class="h h2">烧的其实是</div>
<div class="h h3">太阳</div>
<div class="sub">树存下来的阳光，<em>火还给你</em></div>
</div>
<script>
const g=document.getElementById('cv').getContext('2d');
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function halo(x,y,r,col,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.globalAlpha=a;g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.globalAlpha=1}
const SX=1385,SY=470;
// sun rays + disc
g.globalCompositeOperation='lighter';
halo(SX,SY,520,'rgba(255,150,40,.40)',1);
for(let i=0;i<72;i++){const a=i/72*Math.PI*2,r0=250+((i*37)%5)*6,r1=r0+70+((i*53)%7)*34;g.strokeStyle='rgba(255,190,80,'+(0.16+((i*29)%5)*0.05)+')';g.lineWidth=3;g.beginPath();g.moveTo(SX+Math.cos(a)*r0,SY+Math.sin(a)*r0);g.lineTo(SX+Math.cos(a)*r1,SY+Math.sin(a)*r1);g.stroke()}
g.strokeStyle='rgba(255,201,77,.55)';g.lineWidth=5;g.beginPath();g.arc(SX,SY,236,0,7);g.stroke();
g.strokeStyle='rgba(255,201,77,.22)';g.lineWidth=2;g.beginPath();g.arc(SX,SY,282,0,7);g.stroke();
halo(SX,SY,236,'rgba(255,210,110,.62)',1);
halo(SX,SY,150,'rgba(255,245,200,.55)',1);
g.globalCompositeOperation='source-over';
// logs
[[-1,0.2],[1,-0.2]].forEach(([s,a])=>{g.save();g.translate(SX+s*62,820+s*6);g.rotate(a);const gr=g.createLinearGradient(0,-28,0,28);gr.addColorStop(0,'#6e4c35');gr.addColorStop(.5,'#412c1f');gr.addColorStop(1,'#20150e');g.fillStyle=gr;g.beginPath();g.roundRect(-200,-28,400,56,28);g.fill();g.fillStyle='rgba(255,120,50,.6)';g.fillRect(-180,4,360,16);g.restore()});
// flame
g.globalCompositeOperation='lighter';
halo(SX,770,330,'rgba(255,100,35,.50)',1);
const r=rng(9);
for(let i=0;i<170;i++){const ph=r(),off=r()-.5,rr=r();const age=ph;const y=800-age*(400*(.5+.5*rr));const x=SX+off*300*(1-age*.8)*.55+Math.sin(ph*20)*20*age;const rad=(1-age)*105*(.5+rr*.6)+10;
 const col=age<.22?'255,240,185':age<.55?'255,170,60':'255,85,30';halo(x,y,rad,'rgba('+col+','+(.6*(1-age))+')',1)}
g.globalCompositeOperation='source-over';
for(let i=0;i<80;i++){const x=SX+(r()-.5)*560,y=200+r()*600,s=2+r()*4;g.fillStyle='rgba(255,'+Math.round(170+r()*70)+',90,'+(0.25+r()*0.6)+')';g.beginPath();g.arc(x,y,s,0,7);g.fill()}
// faint floor grid
g.strokeStyle='rgba(255,180,90,.07)';g.lineWidth=2;for(let i=-10;i<=10;i++){g.beginPath();g.moveTo(960+i*60,860);g.lineTo(960+i*320,1080);g.stroke()}
// vignette
const v=g.createRadialGradient(960,540,420,960,540,1150);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');g.fillStyle=v;g.fillRect(0,0,1920,1080);
</script></body></html>
