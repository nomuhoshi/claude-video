<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>cover</title>
<style>
:root{--fg:#eef6ff;--ice:#8fd0ff;--gold:#f2c66b}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;background:#05070b;overflow:hidden}
.c{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:"Noto Sans SC","Noto Sans CJK SC",sans-serif;color:var(--fg);
 background:radial-gradient(900px 640px at 72%,rgba(110,190,255,.16),transparent 70%),radial-gradient(600px 400px at 90%,rgba(242,198,107,.10),transparent 70%),#05070b}
canvas{position:absolute;left:0;top:0}
.h{position:absolute;left:306px;font-family:"Noto Serif SC","Noto Serif CJK SC",serif;font-weight:900;white-space:nowrap}
.h1{top:204px;font-size:100px;line-height:1.1;color:#eef6ff;text-shadow:0 0 30px rgba(143,208,255,.3),0 4px 0 rgba(0,0,0,.6)}
.h3{top:330px;font-size:290px;line-height:1.05;color:var(--gold);letter-spacing:.02em;text-shadow:0 0 60px rgba(242,198,107,.55),0 0 14px rgba(255,220,140,.5),0 6px 0 rgba(70,44,0,.7)}
.sub{position:absolute;left:306px;top:730px;font:900 56px/1.25 "Noto Sans SC","Noto Sans CJK SC",sans-serif;color:#eef6ff;text-shadow:0 2px 0 rgba(0,0,0,.6)}
.sub em{font-style:normal;color:var(--ice)}
</style></head><body><div class="c">
<canvas id="cv" width="1920" height="1080"></canvas>
<div class="h h1">沙子，怎么变成了</div>
<div class="h h3">芯片</div>
<div class="sub"><em>半导体</em>，到底是什么？</div>
</div>
<script>
const g=document.getElementById('cv').getContext('2d');
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function halo(x,y,r,col,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.globalAlpha=a;g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.globalAlpha=1}
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}
const CX=1440,CY=450,S=330;   // chip half size
g.globalCompositeOperation='lighter';halo(CX,CY,470,'rgba(110,190,255,.22)',1);halo(CX,CY,260,'rgba(242,198,107,.22)',1);g.globalCompositeOperation='source-over';
// pins
g.strokeStyle='rgba(238,242,248,.7)';g.lineWidth=7;g.lineCap='round';
for(let i=0;i<8;i++){const o=-S/2+S*(i+.5)/8*1.0-0;const p=CX-S/2+S*(i+.5)/8, q=CY-S/2+S*(i+.5)/8;
 g.beginPath();g.moveTo(p,CY-S/2-34);g.lineTo(p,CY-S/2);g.stroke();g.beginPath();g.moveTo(p,CY+S/2);g.lineTo(p,CY+S/2+34);g.stroke();
 g.beginPath();g.moveTo(CX-S/2-34,q);g.lineTo(CX-S/2,q);g.stroke();g.beginPath();g.moveTo(CX+S/2,q);g.lineTo(CX+S/2+34,q);g.stroke()}
// body
let gr=g.createLinearGradient(CX-S/2,CY-S/2,CX+S/2,CY+S/2);gr.addColorStop(0,'#1a2b46');gr.addColorStop(1,'#0c1626');
g.fillStyle=gr;rr(CX-S/2,CY-S/2,S,S,34);g.fill();g.strokeStyle='rgba(238,242,248,.9)';g.lineWidth=6;rr(CX-S/2,CY-S/2,S,S,34);g.stroke();
// die
const D=210;g.fillStyle='rgba(60,120,190,.35)';rr(CX-D/2,CY-D/2,D,D,14);g.fill();g.strokeStyle='rgba(143,208,255,.95)';g.lineWidth=5;rr(CX-D/2,CY-D/2,D,D,14);g.stroke();
// transistor grid on the die
g.globalCompositeOperation='lighter';
const q=rng(5);
for(let j=0;j<7;j++)for(let i=0;i<7;i++){const x=CX-D/2+22+i*(D-44)/6,y=CY-D/2+22+j*(D-44)/6;const on=q()>0.35;
 halo(x,y,on?26:14,on?'rgba(190,235,255,.95)':'rgba(110,160,220,.5)',on?.9:.5)}
g.globalCompositeOperation='source-over';
for(let j=0;j<7;j++)for(let i=0;i<7;i++){const x=CX-D/2+22+i*(D-44)/6,y=CY-D/2+22+j*(D-44)/6;g.fillStyle='#e6f6ff';g.beginPath();g.arc(x,y,6,0,7);g.fill();
 if(i<6){g.strokeStyle='rgba(143,208,255,.35)';g.lineWidth=2;g.beginPath();g.moveTo(x,y);g.lineTo(x+(D-44)/6,y);g.stroke()}}
// sand drifting up into the chip (bottom left)
const r=rng(9);
for(let k=0;k<150;k++){const u=r(),v=r();const x=CX-S/2-120+u*330, y=CY+S/2+170-v*v*190*(0.4+0.6*(1-Math.abs(u-0.5)*2));
 g.fillStyle='rgba(230,200,138,'+(0.35+r()*0.5)+')';g.beginPath();g.arc(x,y,2.5+r()*4.5,0,7);g.fill()}
// floor grid, stars, vignette
g.strokeStyle='rgba(143,208,255,.06)';g.lineWidth=2;for(let i=-10;i<=10;i++){g.beginPath();g.moveTo(960+i*60,860);g.lineTo(960+i*320,1080);g.stroke()}
const w=rng(11);for(let i=0;i<70;i++){const x=w()*1920,y=w()*1080;g.fillStyle='rgba(190,225,255,'+(0.1+w()*0.35)+')';g.beginPath();g.arc(x,y,1+w()*2.4,0,7);g.fill()}
const v=g.createRadialGradient(960,540,420,960,540,1150);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');g.fillStyle=v;g.fillRect(0,0,1920,1080);
</script></body></html>
