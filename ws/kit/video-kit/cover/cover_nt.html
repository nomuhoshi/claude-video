<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>cover</title>
<!-- Newton cover: an apple hangs in a spotlight; its shadow on the floor is the solar system.  #dy = vertical 1080x1440 -->
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#06070b;overflow:hidden}
.c{position:relative;overflow:hidden;color:#fff;font-family:"Noto Serif SC","Noto Serif CJK SC",serif}
canvas{position:absolute;left:0;top:0}
.kick{position:absolute;font-family:"Noto Sans SC",sans-serif;font-size:30px;color:#9a93ad;letter-spacing:.32em}
.h{position:absolute;font-weight:900;line-height:1.18;color:#f3efe6;letter-spacing:.02em;text-shadow:0 0 30px rgba(255,230,190,.12)}
.h b{font-weight:900;background:linear-gradient(90deg,#ff7a6a,#ffd36b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px rgba(255,180,120,.35))}
.h i{font-style:normal;color:#ffd98a;text-shadow:0 0 28px rgba(255,210,130,.55)}
.sub{position:absolute;font-family:"Noto Sans SC",sans-serif;font-size:30px;color:#c9c2b0;letter-spacing:.12em}
/* 16:9 */
.w .c{width:1920px;height:1080px}
.w .kick{left:270px;top:300px}
.w .h{left:262px;top:352px;font-size:100px}
.w .sub{left:270px;top:640px}
/* vertical */
.v .c{width:1080px;height:1440px}
.v .kick{left:0;right:0;top:150px;text-align:center}
.v .h{left:0;right:0;top:215px;text-align:center;font-size:104px}
.v .sub{left:0;right:0;top:1226px;text-align:center}
</style></head><body><div class="c">
<canvas id="cv"></canvas>
<div class="kick">艾萨克 · 牛顿</div>
<div class="h">从此<span style="letter-spacing:-.45em">，</span>宇宙<br>遵循他的<b>方程</b>运行</div>
<div class="sub">他让天上和地上，第一次服从同一套规则</div>
</div>
<script>
var V = location.hash === '#dy'; document.body.className = V ? 'v' : 'w';
var W = V ? 1080 : 1920, H = V ? 1440 : 1080, cv = document.getElementById('cv'); cv.width = W; cv.height = H;
var g = cv.getContext('2d'), TAU = Math.PI * 2;
function rng(s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; var t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// layout
var AX = V ? 540 : 1300, AY = V ? 640 : 360, AR = V ? 92 : 84;          // apple
var SX = V ? 540 : 1300, SY = V ? 1060 : 810, SW = V ? 440 : 345, SH = V ? 115 : 92;   // shadow ellipse (half axes)
// background: deep gradient + halftone dots brighter under the spotlight
var bg = g.createRadialGradient(AX, (AY + SY) / 2, 40, AX, (AY + SY) / 2, Math.max(W, H) * 0.75);
bg.addColorStop(0, '#1b1a22'); bg.addColorStop(0.55, '#0c0d13'); bg.addColorStop(1, '#040507'); g.fillStyle = bg; g.fillRect(0, 0, W, H);
var step = 14;
for (var y = step / 2; y < H; y += step) for (var x = step / 2; x < W; x += step) {
  var dx = (x - AX) / (V ? 520 : 620), dy = (y - (AY + SY) / 2) / (V ? 640 : 520), d = Math.sqrt(dx * dx + dy * dy);
  var r = Math.max(0, 1 - d) * 2.4; if (r < 0.25) continue;
  g.fillStyle = 'rgba(255,214,150,' + (0.05 + 0.10 * Math.max(0, 1 - d)).toFixed(3) + ')'; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
}
// spotlight cone from above
var cone = g.createLinearGradient(0, 0, 0, SY + SH);
cone.addColorStop(0, 'rgba(255,236,200,0.16)'); cone.addColorStop(1, 'rgba(255,220,170,0.03)');
g.fillStyle = cone; g.beginPath(); g.moveTo(AX - 60, 0); g.lineTo(AX + 60, 0); g.lineTo(SX + SW * 1.05, SY); g.lineTo(SX - SW * 1.05, SY); g.closePath(); g.fill();
// the floor line
var fl = g.createLinearGradient(SX - SW * 1.8, 0, SX + SW * 1.8, 0); fl.addColorStop(0, 'rgba(255,214,150,0)'); fl.addColorStop(0.5, 'rgba(255,214,150,0.25)'); fl.addColorStop(1, 'rgba(255,214,150,0)');
g.strokeStyle = fl; g.lineWidth = 1.5; g.beginPath(); g.moveTo(SX - SW * 1.8, SY + SH * 0.1); g.lineTo(SX + SW * 1.8, SY + SH * 0.1); g.stroke();
// the shadow: a dark ellipse that holds the orbits of the planets; the tree's trunk stands in its centre
var sh = g.createRadialGradient(SX, SY, 10, SX, SY, SW); sh.addColorStop(0, 'rgba(0,0,0,0.85)'); sh.addColorStop(0.8, 'rgba(0,0,0,0.65)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
g.save(); g.translate(SX, SY); g.scale(1, SH / SW); g.fillStyle = sh; g.beginPath(); g.arc(0, 0, SW * 1.05, 0, TAU); g.fill(); g.restore();
var orb = [0.16, 0.28, 0.42, 0.58, 0.76, 0.94], cols = ['#d9c39a', '#f2cf86', '#7fc4ff', '#ff9a7a', '#f2d6a0', '#bfe3ff'], ph = [0.3, 2.2, 4.1, 1.0, 5.4, 3.1];
// half: 'back' draws the far half (behind the trunk), 'front' the near half
function orbits(half) {
  g.globalCompositeOperation = 'lighter';
  var a0 = half === 'back' ? Math.PI : 0, a1 = half === 'back' ? TAU : Math.PI;
  for (var i = 0; i < orb.length; i++) {
    g.strokeStyle = 'rgba(255,205,130,' + (0.75 - i * 0.07).toFixed(2) + ')'; g.lineWidth = 2.2;
    g.beginPath(); g.ellipse(SX, SY, SW * orb[i], SH * orb[i], 0, a0, a1); g.stroke();
    g.strokeStyle = 'rgba(255,205,130,0.12)'; g.lineWidth = 9; g.stroke();
    var back = Math.sin(ph[i]) < 0; if ((half === 'back') !== back) continue;
    var px = SX + SW * orb[i] * Math.cos(ph[i]), py = SY + SH * orb[i] * Math.sin(ph[i]);
    var pg = g.createRadialGradient(px, py, 0, px, py, 26); pg.addColorStop(0, cols[i]); pg.addColorStop(0.3, cols[i] + '88'); pg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = pg; g.beginPath(); g.arc(px, py, 26, 0, TAU); g.fill();
    g.fillStyle = '#fff6e0'; g.beginPath(); g.arc(px, py, 6 + i * 0.6, 0, TAU); g.fill();
  }
  g.globalCompositeOperation = 'source-over';
}
orbits('back');
var sg = g.createRadialGradient(SX, SY, 0, SX, SY, 110); sg.addColorStop(0, 'rgba(255,240,200,1)'); sg.addColorStop(0.18, 'rgba(255,200,100,0.9)'); sg.addColorStop(1, 'rgba(255,150,60,0)');
g.globalCompositeOperation = 'lighter'; g.fillStyle = sg; g.beginPath(); g.arc(SX, SY, 110, 0, TAU); g.fill(); g.globalCompositeOperation = 'source-over';
// the apple tree
var CX = SX, CY = V ? 735 : 395, CR = V ? 205 : 172, TT = CY + CR * 0.55, TW = V ? 30 : 26;
function apple(x, y, r) {
  var hl = g.createRadialGradient(x, y, 0, x, y, r * 2.6); hl.addColorStop(0, 'rgba(255,140,100,0.35)'); hl.addColorStop(1, 'rgba(255,120,80,0)');
  g.fillStyle = hl; g.beginPath(); g.arc(x, y, r * 2.6, 0, TAU); g.fill();
  var gr = g.createRadialGradient(x - r * 0.38, y - r * 0.38, r * 0.06, x, y + r * 0.1, r * 1.15);
  gr.addColorStop(0, '#ffb3a0'); gr.addColorStop(0.35, '#f04a3a'); gr.addColorStop(0.8, '#a2161a'); gr.addColorStop(1, '#4a0a0c');
  g.fillStyle = gr; g.beginPath(); g.moveTo(x, y - r * 0.62);
  g.bezierCurveTo(x + r * 0.55, y - r * 1.12, x + r * 1.18, y - r * 0.5, x + r * 0.97, y + r * 0.25); g.bezierCurveTo(x + r * 0.82, y + r * 0.98, x + r * 0.25, y + r * 1.08, x, y + r * 0.9);
  g.bezierCurveTo(x - r * 0.25, y + r * 1.08, x - r * 0.82, y + r * 0.98, x - r * 0.97, y + r * 0.25); g.bezierCurveTo(x - r * 1.18, y - r * 0.5, x - r * 0.55, y - r * 1.12, x, y - r * 0.62); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.55)'; g.beginPath(); g.ellipse(x - r * 0.42, y - r * 0.3, r * 0.14, r * 0.26, 0.5, 0, TAU); g.fill();
  g.strokeStyle = '#3e2614'; g.lineWidth = r * 0.12; g.lineCap = 'round'; g.beginPath(); g.moveTo(x, y - r * 0.58); g.quadraticCurveTo(x + r * 0.05, y - r * 0.95, x + r * 0.2, y - r * 1.18); g.stroke();
  g.fillStyle = '#4fae5a'; g.beginPath(); g.ellipse(x + r * 0.45, y - r * 1.0, r * 0.36, r * 0.14, -0.5, 0, TAU); g.fill();
}
// trunk and two branches
var tg = g.createLinearGradient(CX - TW, 0, CX + TW, 0); tg.addColorStop(0, '#2a1a10'); tg.addColorStop(0.45, '#6a4428'); tg.addColorStop(1, '#24160d');
g.fillStyle = tg; g.beginPath(); g.moveTo(CX - TW * 1.3, SY + 4); g.quadraticCurveTo(CX - TW * 0.7, (SY + TT) / 2, CX - TW * 0.55, TT - CR * 0.25);
g.lineTo(CX + TW * 0.55, TT - CR * 0.25); g.quadraticCurveTo(CX + TW * 0.7, (SY + TT) / 2, CX + TW * 1.3, SY + 4); g.closePath(); g.fill();
g.strokeStyle = '#4a2f1c'; g.lineCap = 'round'; g.lineWidth = TW * 0.5;
g.beginPath(); g.moveTo(CX, TT); g.quadraticCurveTo(CX - CR * 0.25, TT - CR * 0.3, CX - CR * 0.5, TT - CR * 0.55); g.stroke();
g.beginPath(); g.moveTo(CX, TT - CR * 0.1); g.quadraticCurveTo(CX + CR * 0.3, TT - CR * 0.35, CX + CR * 0.55, TT - CR * 0.5); g.stroke();
// canopy: overlapping leaf masses, lit from the spotlight above
var blobs = [[0, -0.18, 0.62], [-0.52, 0.05, 0.5], [0.55, 0.02, 0.52], [-0.28, -0.52, 0.45], [0.3, -0.5, 0.46], [0, 0.22, 0.5], [-0.72, -0.22, 0.34], [0.76, -0.2, 0.34]];
for (var k = 0; k < blobs.length; k++) {
  var bx = CX + blobs[k][0] * CR, by = CY + blobs[k][1] * CR, br = blobs[k][2] * CR;
  var lg = g.createRadialGradient(bx - br * 0.2, by - br * 0.55, br * 0.1, bx, by, br * 1.05);
  lg.addColorStop(0, '#3f7a4a'); lg.addColorStop(0.5, '#1f4a2c'); lg.addColorStop(1, '#0d2216');
  g.fillStyle = lg; g.beginPath(); g.arc(bx, by, br, 0, TAU); g.fill();
}
// a warm rim where the spotlight touches the top of the crown
var rim = g.createRadialGradient(CX, CY - CR * 0.9, 0, CX, CY - CR * 0.9, CR * 0.9); rim.addColorStop(0, 'rgba(255,214,150,0.32)'); rim.addColorStop(1, 'rgba(255,214,150,0)');
g.globalCompositeOperation = 'lighter'; g.fillStyle = rim; g.beginPath(); g.arc(CX, CY - CR * 0.9, CR * 0.9, 0, TAU); g.fill(); g.globalCompositeOperation = 'source-over';
var AR0 = V ? 26 : 22, apl = [[-0.45, -0.05], [0.18, -0.42], [0.5, 0.18], [-0.12, 0.3], [-0.62, -0.42], [0.66, -0.3]];
for (k = 0; k < apl.length; k++) apple(CX + apl[k][0] * CR, CY + apl[k][1] * CR, AR0 * (0.85 + 0.1 * (k % 3)));
// one apple on its way down, with a faint trail
var fx = CX + CR * 0.42, fy = CY + CR * 0.98;
for (k = 1; k <= 5; k++) { g.fillStyle = 'rgba(255,140,110,' + (0.22 - k * 0.04).toFixed(2) + ')'; g.beginPath(); g.arc(fx, fy - k * AR0 * 0.9, AR0 * (0.55 - k * 0.07), 0, TAU); g.fill(); }
apple(fx, fy, AR0 * 1.15);
orbits('front');
// sparse stars at the top
var R = rng(9); for (i = 0; i < 70; i++) { var sx = R() * W, sy = R() * H * 0.45; g.fillStyle = 'rgba(230,236,255,' + (0.15 + R() * 0.4).toFixed(2) + ')'; g.beginPath(); g.arc(sx, sy, 0.6 + R() * 1.3, 0, TAU); g.fill(); }
</script></body></html>
