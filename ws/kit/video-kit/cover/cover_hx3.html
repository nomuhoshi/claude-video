<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>cover</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;background:#050505;overflow:hidden}
.c{position:relative;width:1920px;height:1080px;overflow:hidden;color:#fff;font-family:"Noto Serif SC","Noto Serif CJK SC",serif}
canvas{position:absolute;left:0;top:0}
.q{position:absolute;left:322px;top:262px;font-weight:900;font-size:58px;line-height:1.42;color:#f3efe6;letter-spacing:.02em;text-shadow:0 0 30px rgba(255,230,190,.12)}
.q b{color:#f2c66b;font-weight:900;text-shadow:0 0 24px rgba(242,198,107,.45)}
.q .br{color:#d9d3c6;font-weight:500}
.by{position:absolute;left:330px;top:458px;font-size:27px;color:#8f8a80;letter-spacing:.04em;font-family:"Noto Serif SC",serif}
.p{position:absolute;left:326px;top:546px;font-size:56px;font-weight:900;color:#f3efe6;letter-spacing:.03em}
.p b{color:#f2c66b;text-shadow:0 0 26px rgba(242,198,107,.5)}
.lab{position:absolute;left:330px;top:770px;font-family:"Noto Sans SC",sans-serif;font-size:24px;color:#9a8a6a;letter-spacing:.2em}
.val{position:absolute;left:324px;top:800px;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:76px;color:#c9a35a;letter-spacing:.02em;text-shadow:0 0 30px rgba(201,163,90,.35)}
.rule{position:absolute;left:330px;top:900px;width:420px;height:2px;background:linear-gradient(90deg,rgba(201,163,90,.6),rgba(201,163,90,0))}
</style></head><body><div class="c">
<canvas id="cv" width="1920" height="1080"></canvas>
<div class="q"><span class="br">「</span>我从想象中得到乐趣，<br>就像跑步的人从<b>出汗</b>中得到乐趣。<span class="br">」</span></div>
<div class="by">—— 费曼，BBC《Fun to Imagine》，1983</div>
<div class="p">热，就是原子在<b>振动</b>。</div>
<div class="lab">空气分子 · 平均速率</div>
<div class="val">470 m/s</div>
<div class="rule"></div>
</div>
<script>
const g=document.getElementById('cv').getContext('2d');
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function halo(x,y,r,col,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.globalAlpha=a;g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.globalAlpha=1}
let bg=g.createLinearGradient(0,0,1920,0);bg.addColorStop(0,'#050505');bg.addColorStop(.6,'#0a0807');bg.addColorStop(1,'#120c08');g.fillStyle=bg;g.fillRect(0,0,1920,1080);
g.globalCompositeOperation='lighter';halo(1400,640,560,'rgba(255,150,70,.22)',1);halo(1370,600,260,'rgba(255,170,90,.18)',1);g.globalCompositeOperation='source-over';
// runner mask on an offscreen canvas
const m=document.createElement('canvas');m.width=1920;m.height=1080;const k=m.getContext('2d');
k.strokeStyle='#fff';k.fillStyle='#fff';k.lineCap='round';k.lineJoin='round';
k.translate(70,0);
k.beginPath();k.ellipse(1432,368,44,50,0.15,0,7);k.fill();
function seg(pts,w){k.lineWidth=w;k.beginPath();k.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)k.lineTo(pts[i][0],pts[i][1]);k.stroke();}
seg([[1424,410],[1414,440]],30);
k.beginPath();k.moveTo(1380,448);k.quadraticCurveTo(1440,440,1450,470);k.lineTo(1400,650);k.quadraticCurveTo(1360,672,1330,645);k.closePath();k.fill();
seg([[1408,478],[1325,548],[1262,500]],30);
seg([[1428,476],[1492,566],[1566,522]],30);
seg([[1372,640],[1468,752],[1440,898],[1486,906]],40);
seg([[1360,646],[1292,768],[1186,792]],40);
k.setTransform(1,0,0,1,0,0);
const md=k.getImageData(0,0,1920,1080).data;
const r=rng(3),S=9;
for(let y=280;y<960;y+=S)for(let x=1150;x<1680;x+=S){
 const xx=x+((y/S)%2?S/2:0);
 const a=md[(y*1920+Math.round(xx))*4+3];if(a<40)continue;
 const d=Math.hypot(xx-1370,y-560), lit=Math.max(0,1-d/520), rad=1.1+2.6*lit*(0.7+0.3*r());
 const jx=(r()-0.5)*3*lit, jy=(r()-0.5)*3*lit;
 const c=`rgba(255,${Math.round(205+40*lit)},${Math.round(150+60*lit)},${(0.35+0.65*lit).toFixed(2)})`;
 if(lit>0.55&&r()<0.25){g.strokeStyle=c;g.globalAlpha=.35;g.lineWidth=rad*0.9;g.beginPath();g.moveTo(xx+jx,y+jy);g.lineTo(xx+jx-(r()-0.5)*14,y+jy-(r()-0.5)*14);g.stroke();g.globalAlpha=1}
 g.fillStyle=c;g.beginPath();g.arc(xx+jx,y+jy,rad,0,7);g.fill();
}
// atoms evaporating off the back of the runner (sweat)
for(let i=0;i<34;i++){
 const t=r(), x=1450-t*230+(r()-0.5)*90, y=410-t*250+(r()-0.5)*70, a=(1-t)*0.8;
 g.globalCompositeOperation='lighter';halo(x,y,10,'rgba(255,190,120,.6)',a);g.globalCompositeOperation='source-over';
 g.fillStyle=`rgba(255,225,180,${a.toFixed(2)})`;g.beginPath();g.arc(x,y,2.2+1.6*(1-t),0,7);g.fill();
 g.strokeStyle=`rgba(255,210,160,${(a*0.4).toFixed(2)})`;g.lineWidth=1.5;g.beginPath();g.moveTo(x,y);g.lineTo(x+16,y+8);g.stroke();
}
const v=g.createRadialGradient(1100,540,420,1000,540,1150);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');g.fillStyle=v;g.fillRect(0,0,1920,1080);
</script></body></html>
