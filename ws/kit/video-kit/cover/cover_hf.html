<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>cover</title>
<style>
:root{--fg:#eef6ff;--ice:#8fd0ff;--red:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;background:#05070b;overflow:hidden}
.c{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:"Noto Sans SC","Noto Sans CJK SC",sans-serif;color:var(--fg);
 background:radial-gradient(900px 640px at 72%,rgba(110,190,255,.16),transparent 70%),radial-gradient(600px 400px at 88%,rgba(255,90,90,.10),transparent 70%),#05070b}
canvas{position:absolute;left:0;top:0}
.h{position:absolute;left:306px;font-family:"Noto Serif SC","Noto Serif CJK SC",serif;font-weight:900;white-space:nowrap}
.h1{top:196px;font-size:112px;line-height:1.1;color:#eef6ff;text-shadow:0 0 30px rgba(143,208,255,.3),0 4px 0 rgba(0,0,0,.6)}
.h3{top:344px;font-size:262px;line-height:1.05;color:var(--red);letter-spacing:.02em;text-shadow:0 0 60px rgba(255,90,90,.6),0 0 14px rgba(255,120,120,.5),0 6px 0 rgba(70,0,0,.7)}
.sub{position:absolute;left:306px;top:730px;font:900 56px/1.25 "Noto Sans SC","Noto Sans CJK SC",sans-serif;color:#eef6ff;text-shadow:0 2px 0 rgba(0,0,0,.6)}
.sub em{font-style:normal;color:var(--ice)}
</style></head><body><div class="c">
<canvas id="cv" width="1920" height="1080"></canvas>
<div class="h h1">测试中的 AI</div>
<div class="h h3">越狱了</div>
<div class="sub">2026 年 7 月事件回顾 · <em>OpenAI 亲口承认</em></div>
</div>
<script>
const g=document.getElementById('cv').getContext('2d');
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function halo(x,y,r,col,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.globalAlpha=a;g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.globalAlpha=1}
const BX=1236,BY=330,BW=350,BH=330;
// box glow and glass
g.globalCompositeOperation='lighter';halo(BX+BW/2,BY+BH/2,420,'rgba(110,190,255,.28)',1);g.globalCompositeOperation='source-over';
g.fillStyle='rgba(143,208,255,.07)';g.beginPath();g.roundRect(BX,BY,BW,BH,26);g.fill();
g.strokeStyle='rgba(143,208,255,.9)';g.lineWidth=7;g.beginPath();g.roundRect(BX,BY,BW,BH,26);g.stroke();
g.strokeStyle='rgba(143,208,255,.35)';g.lineWidth=3;g.beginPath();g.roundRect(BX+22,BY+22,BW-44,BH-44,16);g.stroke();
// agents inside
const r=rng(5);
for(let i=0;i<9;i++){const x=BX+60+r()*(BW-170),y=BY+70+r()*(BH-140);g.globalCompositeOperation='lighter';halo(x,y,38,'rgba(140,200,255,.55)',1);g.globalCompositeOperation='source-over';g.fillStyle='#d8efff';g.beginPath();g.arc(x,y,12,0,7);g.fill()}
// the crack on the right wall
g.save();g.shadowColor='rgba(255,90,90,.9)';g.shadowBlur=30;g.strokeStyle='#ff6b6b';g.lineWidth=9;g.lineJoin='round';g.beginPath();
const cx=BX+BW,pts=[[0,-120],[16,-84],[-12,-48],[18,-10],[-14,30],[14,70],[-6,110],[8,150]];
pts.forEach((p,i)=>{i?g.lineTo(cx+p[0],BY+BH/2+p[1]):g.moveTo(cx+p[0],BY+BH/2+p[1])});g.stroke();g.restore();
g.globalCompositeOperation='lighter';halo(cx,BY+BH/2,230,'rgba(255,90,90,.45)',1);g.globalCompositeOperation='source-over';
// the one that got out, with a trail
const ex=1650,ey=BY+BH/2+4;
for(let i=0;i<16;i++){const t=i/16;g.globalAlpha=(1-t)*.5;g.fillStyle='#bfe5ff';g.beginPath();g.arc(ex-t*150,ey+Math.sin(t*6)*5,14*(1-t*.5),0,7);g.fill()}g.globalAlpha=1;
g.globalCompositeOperation='lighter';halo(ex,ey,110,'rgba(255,200,200,.7)',1);g.globalCompositeOperation='source-over';
g.fillStyle='#fff';g.beginPath();g.arc(ex,ey,19,0,7);g.fill();
// floor grid, stars, vignette
g.strokeStyle='rgba(143,208,255,.06)';g.lineWidth=2;for(let i=-10;i<=10;i++){g.beginPath();g.moveTo(960+i*60,860);g.lineTo(960+i*320,1080);g.stroke()}
const q=rng(11);for(let i=0;i<70;i++){const x=q()*1920,y=q()*1080;g.fillStyle='rgba(190,225,255,'+(0.1+q()*0.35)+')';g.beginPath();g.arc(x,y,1+q()*2.4,0,7);g.fill()}
const v=g.createRadialGradient(960,540,420,960,540,1150);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');g.fillStyle=v;g.fillRect(0,0,1920,1080);
</script></body></html>
