<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>cover</title>
<!-- SpaceX Q3 earnings cover: a rocket lifting off from a glowing AI chip.  #dy = vertical 1080x1440 -->
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#05070c;overflow:hidden}
.c{position:relative;overflow:hidden;color:#fff;font-family:"Noto Serif SC","Noto Serif CJK SC",serif}
canvas{position:absolute;left:0;top:0}
.kick{position:absolute;font-weight:900;font-size:50px;color:#a9c8ff;letter-spacing:.02em;text-shadow:0 0 24px rgba(120,170,255,.45)}
.h{position:absolute;font-weight:900;line-height:1.16;color:#f3efe6;letter-spacing:.01em;text-shadow:0 0 30px rgba(200,220,255,.12)}
.h i{font-style:normal;color:#ffd27a;text-shadow:0 0 30px rgba(255,200,110,.6)}
.sub{position:absolute;font-family:"Noto Sans SC","Noto Sans CJK SC",sans-serif;font-weight:700;font-size:46px;color:#e3e8f0;letter-spacing:.06em;text-shadow:0 2px 12px rgba(0,0,0,.9)}
.w .c{width:1920px;height:1080px}
.w .kick{left:282px;top:170px}
.w .h{left:276px;top:250px;font-size:100px}
.w .sub{left:285px;top:620px;font-size:50px}
.v .c{width:1080px;height:1440px}
.v .kick{left:0;right:0;top:100px;text-align:center;font-size:44px}
.v .h{left:0;right:0;top:180px;text-align:center;font-size:100px}
.v .sub{left:0;right:0;top:1300px;text-align:center;font-size:46px}
</style></head><body><div class="c">
<canvas id="cv"></canvas>
<div class="kick">SpaceX · Q3 2026 EARNINGS</div>
<div class="h">SpaceX 财报出炉<br><i>第一次赚钱了</i></div>
<div class="sub">收入 146 亿 · 净利润 44 亿</div>
</div>
<script>
var V = location.hash === '#dy'; document.body.className = V ? 'v' : 'w';
var W = V ? 1080 : 1920, H = V ? 1440 : 1080, cv = document.getElementById('cv'); cv.width = W; cv.height = H;
var g = cv.getContext('2d');
function rnd(s) { var x = Math.sin(s * 91.7 + 17.3) * 43758.5453; return x - Math.floor(x); }
var S = V ? 1.0 : 1.0, CX = V ? 540 : 1370, CY = V ? 830 : 580;                 // earnings sheet centre
var bg = g.createRadialGradient(CX, CY, 40, CX, CY, V ? 1000 : 1200); bg.addColorStop(0, '#1a2440'); bg.addColorStop(0.45, '#0b1222'); bg.addColorStop(1, '#04060b');
g.fillStyle = bg; g.fillRect(0, 0, W, H);
for (var i = 0; i < 260; i++) { g.fillStyle = 'rgba(255,240,215,' + (0.1 + 0.5 * rnd(i + 5)).toFixed(2) + ')'; var r = 0.6 + 1.6 * rnd(i + 9); g.fillRect(rnd(i) * W, rnd(i + 99) * H, r, r); }
// the earnings sheet
var PW = V ? 760 : 560, PH = V ? 640 : 680, X0 = CX - PW / 2, Y0 = CY - PH / 2;
g.save(); g.shadowColor = 'rgba(255,210,130,0.55)'; g.shadowBlur = 60; g.beginPath(); g.roundRect(X0, Y0, PW, PH, 26);
var pg = g.createLinearGradient(0, Y0, 0, Y0 + PH); pg.addColorStop(0, '#1d2740'); pg.addColorStop(1, '#0e1526'); g.fillStyle = pg; g.fill(); g.shadowBlur = 20; g.strokeStyle = '#ffd27a'; g.lineWidth = 5; g.stroke(); g.restore();
g.textAlign = 'left'; g.fillStyle = '#a9c8ff'; g.font = '900 ' + (V ? 40 : 38) + 'px "Noto Sans CJK SC", sans-serif'; g.fillText((V ? 'SPCX · Q3 财报' : 'SPCX · Q3'), X0 + 44, Y0 + 80);
g.fillStyle = 'rgba(134,182,255,0.35)'; g.fillRect(X0 + 44, Y0 + 104, PW - 88, 3);
// big number
g.font = '900 ' + (V ? 150 : 112) + 'px "Noto Serif CJK SC", serif'; g.fillStyle = '#ffd27a'; g.shadowColor = '#ffb460'; g.shadowBlur = 36; g.fillText('+161%', X0 + 44, Y0 + (V ? 270 : 240)); g.shadowBlur = 0;
g.font = '700 ' + (V ? 40 : 34) + 'px "Noto Sans CJK SC", sans-serif'; g.fillStyle = '#e3e8f0'; g.fillText('收入 146 亿美元', X0 + 44, Y0 + (V ? 336 : 312));
// bars: year ago vs now vs a rising series
var bx = X0 + 60, by = Y0 + PH - 90, bh = PH - (V ? 470 : 440), vals = [0.2, 0.26, 0.34, 0.5, 0.72, 1.0], bw = (PW - 120) / vals.length - 18;
vals.forEach(function (v, i) { var x = bx + i * (bw + 18), h = bh * v; var gr = g.createLinearGradient(0, by - h, 0, by); gr.addColorStop(0, i === 5 ? '#ffe3a0' : '#7fb0ff'); gr.addColorStop(1, i === 5 ? '#f0a840' : '#2c4a8a');
  g.shadowColor = i === 5 ? '#ffb460' : 'rgba(100,150,255,0.5)'; g.shadowBlur = i === 5 ? 30 : 12; g.fillStyle = gr; g.fillRect(x, by - h, bw, h); });
g.shadowBlur = 0; g.fillStyle = 'rgba(200,210,230,0.5)'; g.fillRect(bx - 10, by, PW - 100, 3);
// profit badge
g.save(); var BX = X0 + PW - (V ? 70 : 50), BY = Y0 + 76; g.translate(BX, BY); g.rotate(0.12); if (!V) g.scale(0.8, 0.8);
g.fillStyle = 'rgba(8,40,22,0.92)'; g.strokeStyle = '#6fe0a0'; g.lineWidth = 5; g.shadowColor = '#6fe0a0'; g.shadowBlur = 26; g.beginPath(); g.roundRect(-190, -48, 230, 96, 14); g.fill(); g.stroke(); g.shadowBlur = 0;
g.font = '900 56px "Noto Sans CJK SC", sans-serif'; g.fillStyle = '#9af5c0'; g.textAlign = 'center'; g.fillText('盈利', -75, 20); g.restore();
// small rocket launching off the sheet's top-right corner
if (V) (function () { var rx = X0 + PW + (V ? -10 : -20), ry = Y0 + (V ? 160 : 70); g.save(); g.translate(rx, ry); g.rotate(0.35); g.scale(V ? 0.5 : 0.55, V ? 0.5 : 0.55);
  var fl = g.createRadialGradient(0, 330, 4, 0, 380, 180); fl.addColorStop(0, 'rgba(255,255,240,1)'); fl.addColorStop(0.3, 'rgba(255,210,120,0.95)'); fl.addColorStop(1, 'rgba(255,90,40,0)');
  g.fillStyle = fl; g.beginPath(); g.moveTo(-26, 310); g.quadraticCurveTo(-18, 420, 0, 520); g.quadraticCurveTo(18, 420, 26, 310); g.closePath(); g.shadowColor = '#ffb460'; g.shadowBlur = 50; g.fill(); g.shadowBlur = 0;
  var gr = g.createLinearGradient(-30, 0, 30, 0); gr.addColorStop(0, '#9aa6bc'); gr.addColorStop(0.45, '#f6f8fb'); gr.addColorStop(1, '#7d889e'); g.fillStyle = gr;
  g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(30, 34, 30, 90); g.lineTo(30, 310); g.lineTo(-30, 310); g.lineTo(-30, 90); g.quadraticCurveTo(-30, 34, 0, 0); g.fill();
  g.fillStyle = '#1b2236'; g.fillRect(-30, 130, 60, 7); g.fillRect(-30, 255, 60, 5); g.fillStyle = '#2a3350'; g.beginPath(); g.moveTo(-30, 255); g.lineTo(-58, 330); g.lineTo(-30, 312); g.fill(); g.beginPath(); g.moveTo(30, 255); g.lineTo(58, 330); g.lineTo(30, 312); g.fill(); g.restore(); })();
var vg = g.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 1.0); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.7)'); g.fillStyle = vg; g.fillRect(0, 0, W, H);
</script></body></html>
