<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>cover</title>
<!-- SpaceX Q3 earnings cover: a rocket lifting off from a glowing AI chip.  #dy = vertical 1080x1440 -->
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#05070c;overflow:hidden}
.c{position:relative;overflow:hidden;color:#fff;font-family:"Noto Serif SC","Noto Serif CJK SC",serif}
canvas{position:absolute;left:0;top:0}
.kick{position:absolute;font-weight:900;font-size:64px;color:#a9c8ff;letter-spacing:.02em;text-shadow:0 0 24px rgba(120,170,255,.45)}
.h{position:absolute;font-weight:900;line-height:1.16;color:#f3efe6;letter-spacing:.01em;text-shadow:0 0 30px rgba(200,220,255,.12)}
.h i{font-style:normal;color:#ffd27a;text-shadow:0 0 30px rgba(255,200,110,.6)}
.sub{position:absolute;font-family:"Noto Sans SC","Noto Sans CJK SC",sans-serif;font-weight:700;font-size:46px;color:#e3e8f0;letter-spacing:.06em;text-shadow:0 2px 12px rgba(0,0,0,.9)}
.w .c{width:1920px;height:1080px}
.w .kick{left:282px;top:200px}
.w .h{left:276px;top:290px;font-size:118px}
.w .sub{left:285px;top:620px}
.v .c{width:1080px;height:1440px}
.v .kick{left:0;right:0;top:110px;text-align:center;font-size:72px}
.v .h{left:0;right:0;top:210px;text-align:center;font-size:104px}
.v .sub{left:0;right:0;top:1280px;text-align:center;font-size:50px}
</style></head><body><div class="c">
<canvas id="cv"></canvas>
<div class="kick">SpaceX</div>
<div class="h">第一次赚钱了<span style="letter-spacing:-.45em">，</span><br><i>它在押什么？</i></div>
<div class="sub">2026 年三季度财报解读</div>
</div>
<script>
var V = location.hash === '#dy'; document.body.className = V ? 'v' : 'w';
var W = V ? 1080 : 1920, H = V ? 1440 : 1080, cv = document.getElementById('cv'); cv.width = W; cv.height = H;
var g = cv.getContext('2d');
function rnd(s) { var x = Math.sin(s * 91.7 + 17.3) * 43758.5453; return x - Math.floor(x); }
var CX = V ? 540 : 1400, CY = V ? 1030 : 820, S = V ? 1.15 : 1.0;           // chip centre
var bg = g.createRadialGradient(CX, CY - 200, 40, CX, CY - 200, V ? 1000 : 1200); bg.addColorStop(0, '#1a2440'); bg.addColorStop(0.45, '#0b1222'); bg.addColorStop(1, '#04060b');
g.fillStyle = bg; g.fillRect(0, 0, W, H);
for (var i = 0; i < 260; i++) { g.fillStyle = 'rgba(255,240,215,' + (0.1 + 0.5 * rnd(i + 5)).toFixed(2) + ')'; var r = 0.6 + 1.6 * rnd(i + 9); g.fillRect(rnd(i) * W, rnd(i + 99) * H, r, r); }
// rocket position: rising up and slightly right from the chip
var RX = CX + (V ? 40 : 60) * S, RY = V ? 480 : 120, ANG = 0.12, RS = V ? 0.85 : 1.25;
// gold exhaust trail from the chip up to the rocket's tail
var tailX = RX - Math.sin(ANG) * 0, tailY = RY + 288 * S * RS;
g.save(); g.lineCap = 'round';
for (var k = 0; k < 3; k++) { g.beginPath(); g.moveTo(CX, CY - 40 * S); g.bezierCurveTo(CX, CY - 200 * S, tailX - 40 * S, tailY + 160 * S, tailX - 30 * S * Math.sin(ANG) * 4, tailY + 20 * S);
  g.strokeStyle = k === 0 ? 'rgba(255,190,90,0.18)' : k === 1 ? 'rgba(255,205,120,0.45)' : 'rgba(255,240,200,0.95)'; g.lineWidth = (k === 0 ? 120 : k === 1 ? 46 : 12) * S; g.shadowColor = '#f0bd5c'; g.shadowBlur = k === 2 ? 30 : 60; g.stroke(); }
g.restore();
// sparks
for (var i = 0; i < 140; i++) { var t = rnd(i + 3), px = CX + (tailX - CX) * t + (rnd(i + 7) - 0.5) * 260 * (1 - t) * S, py = CY - 40 * S + (tailY - CY) * t + (rnd(i + 11) - 0.5) * 120 * S;
  g.fillStyle = 'rgba(255,' + (190 + 50 * rnd(i)).toFixed(0) + ',120,' + (0.25 + 0.6 * t).toFixed(2) + ')'; g.beginPath(); g.arc(px, py, (1 + 3 * rnd(i + 13)) * S, 0, 6.29); g.fill(); }
// the AI chip (square die, pins on four sides)
(function () { var w = 300 * S; g.save(); g.translate(CX, CY); g.rotate(-0.04);
  g.fillStyle = '#c9a052'; for (var i = 0; i < 9; i++) { var o = -w / 2 + w * 0.1 + i * w * 0.1; g.fillRect(o - 6 * S, -w / 2 - 34 * S, 12 * S, 34 * S); g.fillRect(o - 6 * S, w / 2, 12 * S, 34 * S); g.fillRect(-w / 2 - 34 * S, o - 6 * S, 34 * S, 12 * S); g.fillRect(w / 2, o - 6 * S, 34 * S, 12 * S); }
  g.shadowColor = 'rgba(255,210,130,0.9)'; g.shadowBlur = 70; var gr = g.createLinearGradient(-w / 2, -w / 2, w / 2, w / 2); gr.addColorStop(0, '#3a4a72'); gr.addColorStop(0.55, '#1c2742'); gr.addColorStop(1, '#121a2e');
  g.fillStyle = gr; g.beginPath(); g.rect(-w / 2, -w / 2, w, w); g.fill(); g.shadowBlur = 24; g.strokeStyle = '#ffd27a'; g.lineWidth = 6 * S; g.stroke(); g.shadowBlur = 0;
  g.strokeStyle = 'rgba(134,182,255,0.35)'; g.lineWidth = 2; for (var i = 1; i < 6; i++) { g.beginPath(); g.moveTo(-w / 2 + i * w / 6, -w / 2 + 20 * S); g.lineTo(-w / 2 + i * w / 6, w / 2 - 20 * S); g.stroke(); g.beginPath(); g.moveTo(-w / 2 + 20 * S, -w / 2 + i * w / 6); g.lineTo(w / 2 - 20 * S, -w / 2 + i * w / 6); g.stroke(); }
  g.fillStyle = 'rgba(8,12,20,0.75)'; g.fillRect(-w * 0.3, -w * 0.18, w * 0.6, w * 0.36); g.font = '900 ' + Math.round(110 * S) + 'px "Noto Serif CJK SC", serif'; g.textAlign = 'center'; g.fillStyle = '#ffd27a'; g.shadowColor = '#ffb460'; g.shadowBlur = 30; g.fillText('AI', 0, 40 * S);
  g.restore(); })();
// flame + rocket
(function () { g.save(); g.translate(RX, RY); g.rotate(ANG); g.scale(S * RS, S * RS);
  var fl = g.createRadialGradient(0, 330, 4, 0, 380, 200); fl.addColorStop(0, 'rgba(255,255,240,1)'); fl.addColorStop(0.25, 'rgba(255,210,120,0.95)'); fl.addColorStop(0.6, 'rgba(255,120,60,0.6)'); fl.addColorStop(1, 'rgba(255,90,40,0)');
  g.fillStyle = fl; g.beginPath(); g.moveTo(-30, 310); g.quadraticCurveTo(-24, 400, 0, V ? 470 : 560); g.quadraticCurveTo(24, 400, 30, 310); g.closePath(); g.shadowColor = '#ffb460'; g.shadowBlur = 50; g.fill(); g.shadowBlur = 0;
  var gr = g.createLinearGradient(-30, 0, 30, 0); gr.addColorStop(0, '#9aa6bc'); gr.addColorStop(0.45, '#f6f8fb'); gr.addColorStop(1, '#7d889e');
  g.shadowColor = 'rgba(200,220,255,0.6)'; g.shadowBlur = 30; g.fillStyle = gr; g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(30, 34, 30, 90); g.lineTo(30, 310); g.lineTo(-30, 310); g.lineTo(-30, 90); g.quadraticCurveTo(-30, 34, 0, 0); g.fill(); g.shadowBlur = 0;
  g.fillStyle = '#1b2236'; g.fillRect(-30, 130, 60, 7); g.fillRect(-30, 255, 60, 5);
  g.fillStyle = '#2a3350'; g.beginPath(); g.moveTo(-30, 255); g.lineTo(-58, 330); g.lineTo(-30, 312); g.fill(); g.beginPath(); g.moveTo(30, 255); g.lineTo(58, 330); g.lineTo(30, 312); g.fill();
  g.restore(); })();
var vg = g.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 1.0); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.7)'); g.fillStyle = vg; g.fillRect(0, 0, W, H);
</script></body></html>
