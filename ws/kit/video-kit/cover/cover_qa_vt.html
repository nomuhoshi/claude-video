<!doctype html><html lang="en"><head><meta charset="utf-8"><title>cover</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;background:#04060a;overflow:hidden}
.c{position:relative;width:1920px;height:1080px;overflow:hidden;background:#04060a}
canvas,svg{position:absolute;left:0;top:0}
.t{position:absolute;left:262px;top:112px;font-family:"Lora","DejaVu Serif",serif;font-weight:500;font-size:172px;line-height:1.02;color:#fff;letter-spacing:-2px;text-shadow:0 6px 30px rgba(0,0,0,.65),0 2px 0 rgba(0,0,0,.5)}
</style></head><body><div class="c">
<canvas id="cv" width="1920" height="1080"></canvas>
<div class="t">It should<br>collapse.</div>
<svg width="1920" height="1080" viewBox="0 0 1920 1080">
 <!-- hand-drawn red underline under "collapse." -->
 <path d="M268 468 C 520 452, 800 462, 1010 446" stroke="#e5262e" stroke-width="13" fill="none" stroke-linecap="round"/>
 <path d="M300 484 C 540 474, 760 480, 930 470" stroke="#e5262e" stroke-width="9" fill="none" stroke-linecap="round" opacity=".9"/>
 <!-- red curved arrow to the nucleus -->
 <path d="M560 560 C 640 700, 820 760, 1010 690" stroke="#e5262e" stroke-width="15" fill="none" stroke-linecap="round" style="filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))"/>
 <path d="M1010 690 L 944 674 M1010 690 L 968 742" stroke="#e5262e" stroke-width="15" fill="none" stroke-linecap="round" style="filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))"/>
</svg>
</div>
<script>
const g=document.getElementById('cv').getContext('2d');
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function halo(x,y,r,col,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.globalAlpha=a;g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.globalAlpha=1}
// background: deep lab-dark gradient with soft blue light from the right
let bg=g.createRadialGradient(1300,520,50,1300,520,1100);bg.addColorStop(0,'#10223a');bg.addColorStop(.5,'#080f1b');bg.addColorStop(1,'#03050a');g.fillStyle=bg;g.fillRect(0,0,1920,1080);
// bokeh
const q=rng(9);g.globalCompositeOperation='lighter';
for(let i=0;i<26;i++){const x=900+q()*1000,y=q()*1080,r=14+q()*46;halo(x,y,r,'rgba(110,170,255,.55)',0.05+q()*0.10)}
g.globalCompositeOperation='source-over';
const NX=1270,NY=650;           // nucleus
const SX=1,SY=0.66,TILT=-0.2;   // orbit plane squash and rotation
function P(r,a){const x=r*Math.cos(a)*SX,y=r*Math.sin(a)*SY;return[NX+x*Math.cos(TILT)-y*Math.sin(TILT),NY+x*Math.sin(TILT)+y*Math.cos(TILT)]}
g.lineWidth=2;for(let k=1;k<=4;k++){g.strokeStyle='rgba(140,190,255,'+(0.08-k*0.01)+')';g.beginPath();for(let a=0;a<=6.3;a+=.05){const p=P(110*k+90,a);a?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}g.stroke()}
const R0=600,TH=Math.PI*2*2.0,N=1400;
function S(u){const r=R0*(1-u)+16;const a=-0.3-TH*Math.pow(u,0.75);return P(r,a)}
const UH=0.70;                      // where the electron is now
// remaining path to the nucleus: faint dashed
g.setLineDash([14,16]);g.strokeStyle='rgba(180,225,255,.38)';g.lineWidth=5;g.beginPath();for(let i=0;i<=300;i++){const u=UH+(0.985-UH)*i/300,p=S(u);i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}g.stroke();g.setLineDash([]);
// bright trail up to the electron
for(let i=0;i<N;i++){const u0=UH*i/N,u1=UH*(i+1)/N,a=S(u0),b=S(u1),f=i/N,w=4+22*Math.pow(f,1.5);
 g.strokeStyle='rgba(190,228,255,'+(0.16+0.84*Math.pow(f,1.1))+')';g.lineWidth=w;g.lineCap='butt';
 g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke()}
g.globalCompositeOperation='lighter';for(let i=0;i<N;i+=20){const u=UH*i/N,p=S(u),f=i/N;halo(p[0],p[1],24+70*f,'rgba(120,190,255,.8)',0.04+0.26*f)}g.globalCompositeOperation='source-over';
// nucleus
g.globalCompositeOperation='lighter';halo(NX,NY,460,'rgba(255,120,50,.5)',1);halo(NX,NY,230,'rgba(255,170,90,.85)',1);g.globalCompositeOperation='source-over';
const NR=88;let sg=g.createRadialGradient(NX-30,NY-34,6,NX,NY,NR);sg.addColorStop(0,'#fff1dc');sg.addColorStop(.25,'#ffb36b');sg.addColorStop(.7,'#e8591f');sg.addColorStop(1,'#7a1d08');
g.fillStyle=sg;g.beginPath();g.arc(NX,NY,NR,0,7);g.fill();
g.fillStyle='rgba(255,255,255,.75)';g.beginPath();g.ellipse(NX-34,NY-40,22,12,-0.7,0,7);g.fill();
// electron head
const pe=S(UH);const EX=pe[0],EY=pe[1];
g.globalCompositeOperation='lighter';halo(EX,EY,200,'rgba(170,220,255,.95)',1);halo(EX,EY,70,'rgba(255,255,255,.95)',1);
g.strokeStyle='rgba(190,230,255,.6)';g.lineWidth=3;g.beginPath();g.moveTo(EX-210,EY);g.lineTo(EX+210,EY);g.stroke();g.beginPath();g.moveTo(EX,EY-120);g.lineTo(EX,EY+120);g.stroke();
g.globalCompositeOperation='source-over';
g.fillStyle='#fff';g.beginPath();g.arc(EX,EY,30,0,7);g.fill();
// light leaving the trail
g.strokeStyle='rgba(255,215,120,.6)';g.lineWidth=6;g.lineCap='round';
for(let k=0;k<3;k++){const u=0.22+k*0.13,p=S(u);g.beginPath();g.arc(p[0],p[1],38+k*14,-1.2,1.2);g.stroke()}
// vignette
const v=g.createRadialGradient(960,540,420,960,540,1200);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');g.fillStyle=v;g.fillRect(0,0,1920,1080);
</script></body></html>
