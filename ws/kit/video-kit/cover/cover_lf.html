<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>cover</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;background:#050505;overflow:hidden}
.c{position:relative;width:1920px;height:1080px;overflow:hidden;color:#fff;font-family:"Noto Serif SC","Noto Serif CJK SC",serif}
canvas{position:absolute;left:0;top:0}
.kick{position:absolute;left:330px;top:206px;font-family:"Noto Sans SC",sans-serif;font-size:26px;color:#9a8a6a;letter-spacing:.32em}
.h{position:absolute;left:318px;top:250px;font-weight:900;font-size:88px;line-height:1.32;color:#f3efe6;letter-spacing:.02em;text-shadow:0 0 30px rgba(255,230,190,.12)}
.h b{color:#f2c66b;font-weight:900;text-shadow:0 0 28px rgba(242,198,107,.5)}
.p{position:absolute;left:326px;top:540px;font-size:46px;font-weight:900;color:#e9e3d6;letter-spacing:.03em}
.p b{color:#ffd98a;text-shadow:0 0 30px rgba(255,210,130,.75)}
.lab{position:absolute;left:330px;top:770px;font-family:"Noto Sans SC",sans-serif;font-size:24px;color:#9a8a6a;letter-spacing:.2em}
.val{position:absolute;left:326px;top:802px;font-weight:900;font-size:64px;color:#c9a35a;letter-spacing:.06em;text-shadow:0 0 30px rgba(201,163,90,.35)}
.rule{position:absolute;left:330px;top:900px;width:420px;height:2px;background:linear-gradient(90deg,rgba(201,163,90,.6),rgba(201,163,90,0))}
</style></head><body><div class="c">
<canvas id="cv" width="1920" height="1080"></canvas>
<div class="kick">长寿研究 · 2026</div>
<div class="h">2026 年了，<br>人类<b>寿命</b>走到哪一步</div>
<div class="p">让细胞“<b>变年轻</b>”，第一次进入人体试验</div>
<div class="lab">有记录的最长寿命</div>
<div class="val">122 岁</div>
<div class="rule"></div>
</div>
<script>
const g=document.getElementById('cv').getContext('2d');
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function halo(x,y,r,col,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.globalAlpha=a;g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.globalAlpha=1}
let bg=g.createLinearGradient(0,0,1920,0);bg.addColorStop(0,'#050505');bg.addColorStop(.6,'#08080a');bg.addColorStop(1,'#100c08');g.fillStyle=bg;g.fillRect(0,0,1920,1080);
const CX=1480,CY=500,R=235;
g.globalCompositeOperation='lighter';halo(CX+60,CY,520,'rgba(255,170,80,.16)',1);g.globalCompositeOperation='source-over';
// one cell: the left part old and grey with dark spots, the right part young and gold; a bright front between them
const r=rng(4),spots=[];for(let i=0;i<30;i++)spots.push([CX-R+r()*R*1.2,CY-R+r()*2*R,10+r()*26]);
const S=12;
for(let y=CY-R;y<=CY+R;y+=S*0.87){const row=Math.round((y-CY)/(S*0.87));for(let x=CX-R;x<=CX+R;x+=S){
 const xx=x+(row%2?S/2:0),d=Math.hypot(xx-CX,y-CY);if(d>R)continue;
 const front=CX-40+(y-CY)*0.35, k=Math.max(0,Math.min(1,(xx-front)/60+0.5));
 let blot=0;for(const s of spots)if(Math.hypot(xx-s[0],y-s[1])<s[2])blot=1;
 const edge=1-Math.max(0,(d/R-0.85)/0.15), nucl=Math.hypot(xx-CX-30,y-CY+10)<R*0.3;
 const o=blot?[60,64,74,0.85,0.7]:[140,148,162,0.45+0.3*edge,0.8];
 const yv=nucl?[255,226,150,1,1.1]:[242,198,107,0.6+0.4*edge,1.0];
 const c=o.map((v,i)=>v+(yv[i]-v)*k);
 g.fillStyle=`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${c[3].toFixed(2)})`;g.beginPath();g.arc(xx,y,S*0.36*c[4],0,7);g.fill();
}}
// the front line glows
g.globalCompositeOperation='lighter';
for(let i=0;i<14;i++){const yy=CY-R+i*(2*R/13),fx=CX-40+(yy-CY)*0.35;if(Math.hypot(fx-CX,yy-CY)<R)halo(fx,yy,48,'rgba(255,220,140,.5)',0.6);}
g.globalCompositeOperation='source-over';
g.font='700 26px "Noto Sans SC",sans-serif';g.textAlign='center';g.fillStyle='rgba(160,168,182,.85)';g.fillText('衰老的细胞',CX-130,CY+R+52);g.fillStyle='rgba(242,198,107,.95)';g.fillText('变年轻',CX+130,CY+R+52);
const v=g.createRadialGradient(1100,540,420,1000,540,1150);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');g.fillStyle=v;g.fillRect(0,0,1920,1080);
</script></body></html>
