<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>cover</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;background:#05070d;overflow:hidden}
.c{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:"Noto Sans SC","Noto Sans CJK SC",sans-serif;color:#fff}
canvas{position:absolute;left:0;top:0}
.t{position:absolute;left:0;right:0;text-align:center;font-family:"Noto Serif SC","Noto Serif CJK SC",serif;font-weight:900;white-space:nowrap}
.t1{top:86px;font-size:112px;line-height:1.1;color:#f4f7ff;text-shadow:0 6px 0 rgba(0,0,0,.55)}
.t2{top:222px;font-size:132px;line-height:1.1;color:#f4f7ff;text-shadow:0 6px 0 rgba(0,0,0,.55)}
.t2 em{font-style:normal;font-size:196px;color:#ffd36a;text-shadow:0 0 60px rgba(255,200,80,.6),0 0 16px rgba(255,210,100,.6),0 6px 0 rgba(80,50,0,.7)}
</style></head><body><div class="c">
<canvas id="cv" width="1920" height="1080"></canvas>
<div class="t t1">你和身边的人之间，</div>
<div class="t t2">藏着举起<em>地球</em>的力</div>
</div>
<script>
const g=document.getElementById('cv').getContext('2d');
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function halo(x,y,r,col,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.globalAlpha=a;g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.globalAlpha=1}
let sk=g.createLinearGradient(0,0,0,1080);sk.addColorStop(0,'#04060c');sk.addColorStop(.6,'#0a1020');sk.addColorStop(1,'#07080d');g.fillStyle=sk;g.fillRect(0,0,1920,1080);
const q=rng(7);for(let i=0;i<110;i++){g.fillStyle='rgba(200,220,255,'+(0.1+q()*0.4)+')';g.beginPath();g.arc(q()*1920,q()*1000,0.8+q()*1.6,0,7);g.fill()}
// side glows: blue left, red right
g.globalCompositeOperation='lighter';
halo(380,760,520,'rgba(70,130,255,.38)',1);halo(1540,760,520,'rgba(255,80,80,.34)',1);
g.globalCompositeOperation='source-over';
const EX=960,EY=690,ER=118;
// field beams from each person to Earth
function beam(x0,y0,x1,y1,cx,cy,col,w){
 g.lineCap='round';
 g.strokeStyle=col.replace('A','.18');g.lineWidth=w*5;g.beginPath();g.moveTo(x0,y0);g.quadraticCurveTo(cx,cy,x1,y1);g.stroke();
 g.strokeStyle=col.replace('A','.5');g.lineWidth=w*2;g.beginPath();g.moveTo(x0,y0);g.quadraticCurveTo(cx,cy,x1,y1);g.stroke();
 g.strokeStyle=col.replace('A','1');g.lineWidth=w*.6;g.beginPath();g.moveTo(x0,y0);g.quadraticCurveTo(cx,cy,x1,y1);g.stroke();}
for(let k=0;k<4;k++){
 beam(500+dirk(1)*0+190+k*6,650+k*26,EX-ER*0.92,EY+18+k*16,720,560+k*40,'rgba(120,180,255,A)',5-k*.7);
 beam(1420-190-k*6,650+k*26,EX+ER*0.92,EY+18+k*16,1200,560+k*40,'rgba(255,120,110,A)',5-k*.7);
}
function dirk(){return 0}
// Earth
g.globalCompositeOperation='lighter';halo(EX,EY,300,'rgba(120,190,255,.35)',1);g.globalCompositeOperation='source-over';
const eg=g.createRadialGradient(EX-40,EY-45,10,EX,EY,ER);eg.addColorStop(0,'#5fb0ff');eg.addColorStop(.55,'#1e5aa8');eg.addColorStop(1,'#07204a');
g.fillStyle=eg;g.beginPath();g.arc(EX,EY,ER,0,7);g.fill();
g.save();g.beginPath();g.arc(EX,EY,ER,0,7);g.clip();
g.fillStyle='rgba(90,190,120,.85)';
for(const b of [[-60,-30,50,30],[-20,10,36,48],[40,-50,44,24],[55,20,30,30],[-80,30,24,22]]){g.beginPath();g.ellipse(EX+b[0],EY+b[1],b[2],b[3],0.4,0,7);g.fill()}
const sh=g.createRadialGradient(EX-50,EY-50,30,EX+30,EY+30,ER*1.15);sh.addColorStop(0,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,0,10,.6)');g.fillStyle=sh;g.fillRect(EX-ER,EY-ER,ER*2,ER*2);
g.restore();
g.strokeStyle='rgba(180,225,255,.7)';g.lineWidth=3;g.beginPath();g.arc(EX,EY,ER,0,7);g.stroke();
// people silhouettes
function person(x,base,h,col,rim,dir){
 const hr=h*.095, bw=h*.19;
 g.save();
 g.fillStyle='#070a12';g.strokeStyle=rim;g.lineWidth=5;
 g.beginPath();g.arc(x,base-h+hr,hr,0,7);g.fill();g.stroke();
 g.beginPath();
 g.moveTo(x-bw,base-h*.62);g.quadraticCurveTo(x-bw*1.05,base-h*.8,x-bw*.5,base-h*.8);
 g.lineTo(x+bw*.5,base-h*.8);g.quadraticCurveTo(x+bw*1.05,base-h*.8,x+bw,base-h*.62);
 g.lineTo(x+bw*.6,base-h*.38);g.lineTo(x+bw*.55,base);g.lineTo(x+bw*.08,base);g.lineTo(x,base-h*.3);g.lineTo(x-bw*.08,base);g.lineTo(x-bw*.55,base);g.lineTo(x-bw*.6,base-h*.38);g.closePath();
 g.fill();g.stroke();
 // raised arm toward earth
 g.lineWidth=h*.07;g.lineCap='round';g.strokeStyle='#070a12';
 g.beginPath();g.moveTo(x+dir*bw*.8,base-h*.74);g.lineTo(x+dir*bw*2.3,base-h*.86);g.stroke();
 g.lineWidth=4;g.strokeStyle=rim;g.beginPath();g.moveTo(x+dir*bw*.8,base-h*.74-h*.035);g.lineTo(x+dir*bw*2.3,base-h*.86-h*.035);g.stroke();
 g.restore();
 g.globalCompositeOperation='lighter';halo(x,base-h*.55,h*.7,col,1);g.globalCompositeOperation='source-over';
}
const base=950;
person(500,base,430,'rgba(80,140,255,.25)','rgba(130,190,255,.95)',1);
person(1420,base,430,'rgba(255,90,90,.22)','rgba(255,140,130,.95)',-1);
// ground
g.fillStyle='#06070c';g.fillRect(0,base,1920,140);
g.strokeStyle='rgba(160,190,255,.25)';g.lineWidth=3;g.beginPath();g.moveTo(0,base);g.lineTo(1920,base);g.stroke();
// + / - marks
g.font='900 90px "Noto Sans SC"';g.textAlign='center';
g.fillStyle='rgba(140,195,255,.9)';g.fillText('+',500,760);
g.fillStyle='rgba(255,150,140,.9)';g.fillText('−',1420,760);
const v=g.createRadialGradient(960,560,500,960,560,1250);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.5)');g.fillStyle=v;g.fillRect(0,0,1920,1080);
</script></body></html>
