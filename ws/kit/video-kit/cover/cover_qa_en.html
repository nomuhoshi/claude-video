<!doctype html><html lang="en"><head><meta charset="utf-8"><title>cover</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;background:#07050a;overflow:hidden}
.c{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:"Inter","Inter Display",sans-serif;color:#fff;
 background:radial-gradient(1100px 800px at 50% 32%,rgba(255,120,60,.22),transparent 70%),radial-gradient(1500px 900px at 50% 50%,rgba(120,30,40,.35),transparent 75%),#07050a}
canvas{position:absolute;left:0;top:0}
.tape{position:absolute;left:-200px;width:2320px;top:575px;height:200px;transform:rotate(-7deg);transform-origin:50% 50%;background:#f6c453;box-shadow:0 0 80px rgba(246,196,83,.45),0 20px 0 rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.tape::before,.tape::after{content:"";position:absolute;left:0;right:0;height:34px;background:repeating-linear-gradient(-45deg,#10090a 0 30px,#f6c453 30px 60px)}
.tape::before{top:0}.tape::after{bottom:0}
.tape span{font-weight:900;font-size:106px;letter-spacing:-2px;color:#120a0b;white-space:nowrap;margin-top:4px}
.q{position:absolute;left:0;right:0;top:842px;text-align:center;font-weight:800;font-size:56px;letter-spacing:.01em;color:#fff6e4;text-shadow:0 3px 0 rgba(0,0,0,.7),0 0 26px rgba(0,0,0,.8)}
.q em{font-style:normal;color:#ff7a5c}
</style></head><body><div class="c">
<canvas id="cv" width="1920" height="1080"></canvas>
<div class="tape"><span>YOU SHOULDN’T EXIST</span></div>
<div class="q">Why doesn’t the atom <em>collapse</em>?</div>
</div>
<script>
const g=document.getElementById('cv').getContext('2d');
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function halo(x,y,r,col,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.globalAlpha=a;g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.globalAlpha=1}
const CX=960,CY=330,R=340;
// faint concentric orbit rings bleeding off the frame
g.strokeStyle='rgba(255,170,110,.14)';g.lineWidth=3;
for(let k=1;k<=6;k++){g.beginPath();g.arc(CX,CY,R*k/3.6,0,7);g.stroke()}
// the death spiral, many turns
const TH=Math.PI*2*4.2;
function sp(u){return[R*Math.pow(1-u,0.8),-1.2+TH*Math.pow(u,0.8)]}
const N=900,UE=0.97;
for(let i=0;i<N;i++){const u0=UE*i/N,u1=UE*(i+1)/N,a=sp(u0),b=sp(u1),f=i/N;
 g.strokeStyle='rgba('+(255)+','+Math.round(150+90*f)+','+Math.round(90+120*f)+','+(0.22+0.78*Math.pow(f,1.2))+')';g.lineWidth=3+10*f;g.lineCap='butt';
 g.beginPath();g.moveTo(CX+a[0]*Math.cos(a[1]),CY+a[0]*Math.sin(a[1]));g.lineTo(CX+b[0]*Math.cos(b[1]),CY+b[0]*Math.sin(b[1]));g.stroke()}
g.globalCompositeOperation='lighter';halo(CX,CY,300,'rgba(255,120,60,.8)',1);halo(CX,CY,120,'rgba(255,230,190,.9)',1);g.globalCompositeOperation='source-over';
const pe=sp(UE),ex=CX+pe[0]*Math.cos(pe[1]),ey=CY+pe[0]*Math.sin(pe[1]);
g.globalCompositeOperation='lighter';halo(ex,ey,130,'rgba(200,235,255,.9)',1);g.globalCompositeOperation='source-over';
g.fillStyle='#fff';g.beginPath();g.arc(ex,ey,15,0,7);g.fill();
const q=rng(5);for(let i=0;i<90;i++){const x=q()*1920,y=q()*1080;g.fillStyle='rgba(255,220,190,'+(0.08+q()*0.3)+')';g.beginPath();g.arc(x,y,1+q()*2.2,0,7);g.fill()}
const v=g.createRadialGradient(960,540,450,960,540,1180);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.6)');g.fillStyle=v;g.fillRect(0,0,1920,1080);
</script></body></html>
