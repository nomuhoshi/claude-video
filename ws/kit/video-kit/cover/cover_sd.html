<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>cover</title>
<!-- SanDisk cover: a glowing memory card blasting upward like a rocket, leaving a gold trail.  #dy = vertical 1080x1440 -->
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#05070c;overflow:hidden}
.c{position:relative;overflow:hidden;color:#fff;font-family:"Noto Serif SC","Noto Serif CJK SC",serif}
canvas{position:absolute;left:0;top:0}
.kick{position:absolute;font-weight:900;font-size:64px;color:#a9c8ff;letter-spacing:.02em;text-shadow:0 0 24px rgba(120,170,255,.45)}
.h{position:absolute;font-weight:900;line-height:1.16;color:#f3efe6;letter-spacing:.01em;text-shadow:0 0 30px rgba(200,220,255,.12)}
.h i{font-style:normal;color:#ffd27a;text-shadow:0 0 30px rgba(255,200,110,.6)}
.sub{position:absolute;font-family:"Noto Sans SC","Noto Sans CJK SC",sans-serif;font-weight:700;font-size:46px;color:#e3e8f0;letter-spacing:.06em;text-shadow:0 2px 12px rgba(0,0,0,.9)}
.w .c{width:1920px;height:1080px}
.w .kick{left:282px;top:200px}
.w .h{left:276px;top:290px;font-size:104px}
.w .sub{left:285px;top:590px}
.v .c{width:1080px;height:1440px}
.v .kick{left:0;right:0;top:110px;text-align:center;font-size:72px}
.v .h{left:0;right:0;top:210px;text-align:center;font-size:104px}
.v .sub{left:0;right:0;top:1280px;text-align:center;font-size:50px}
</style></head><body><div class="c">
<canvas id="cv"></canvas>
<div class="kick">SanDisk</div>
<div class="h">卖内存卡的<span style="letter-spacing:-.45em">，</span><br><i>凭什么涨了几十倍？</i></div>
<div class="sub">闪迪到底是一家什么公司？</div>
</div>
<script>
var V = location.hash === '#dy'; document.body.className = V ? 'v' : 'w';
var W = V ? 1080 : 1920, H = V ? 1440 : 1080, cv = document.getElementById('cv'); cv.width = W; cv.height = H;
var g = cv.getContext('2d');
function rnd(s) { var x = Math.sin(s * 91.7 + 17.3) * 43758.5453; return x - Math.floor(x); }
// card position, angle (pointing up-right) and the trail start
var CX = V ? 640 : 1440, CY = V ? 760 : 430, ANG = 0.62, SZ = V ? 230 : 190, TX = V ? 90 : 760, TY = V ? 1150 : 1080;
var bg = g.createRadialGradient(CX, CY, 40, CX, CY, V ? 1000 : 1200); bg.addColorStop(0, '#1a2440'); bg.addColorStop(0.45, '#0b1222'); bg.addColorStop(1, '#04060b');
g.fillStyle = bg; g.fillRect(0, 0, W, H);
for (var i = 0; i < 260; i++) { g.fillStyle = 'rgba(255,240,215,' + (0.1 + 0.5 * rnd(i + 5)).toFixed(2) + ')'; var r = 0.6 + 1.6 * rnd(i + 9); g.fillRect(rnd(i) * W, rnd(i + 99) * H, r, r); }
// direction of travel and the card's tail point
var ux = Math.sin(ANG), uy = -Math.cos(ANG);        // the card's "up" (direction of flight)
var h = SZ * 1.33, tailX = CX - ux * h * 0.5, tailY = CY - uy * h * 0.5;
// gold trail: a curve rising from the lower left into the tail
g.save(); g.lineCap = 'round';
for (var k = 0; k < 3; k++) {
  g.beginPath(); g.moveTo(TX, TY); g.bezierCurveTo(TX + (tailX - TX) * 0.55, TY - 40, tailX - ux * 260, tailY - uy * 260, tailX, tailY);
  g.strokeStyle = k === 0 ? 'rgba(255,190,90,0.18)' : k === 1 ? 'rgba(255,205,120,0.45)' : 'rgba(255,240,200,0.95)'; g.lineWidth = k === 0 ? 120 : k === 1 ? 46 : 12; g.shadowColor = '#f0bd5c'; g.shadowBlur = k === 2 ? 30 : 60; g.stroke();
}
g.restore();
// flame out of the tail
g.save(); g.translate(tailX, tailY); g.rotate(Math.atan2(-uy, -ux));
var fl = g.createRadialGradient(0, 0, 4, 60, 0, 220); fl.addColorStop(0, 'rgba(255,255,240,1)'); fl.addColorStop(0.25, 'rgba(255,210,120,0.95)'); fl.addColorStop(0.6, 'rgba(255,120,60,0.6)'); fl.addColorStop(1, 'rgba(255,90,40,0)');
g.fillStyle = fl; g.beginPath(); g.moveTo(0, -SZ * 0.36); g.quadraticCurveTo(140, -SZ * 0.3, 260, 0); g.quadraticCurveTo(140, SZ * 0.3, 0, SZ * 0.36); g.closePath(); g.shadowColor = '#ffb460'; g.shadowBlur = 50; g.fill();
g.restore();
// sparks around the flame and along the trail
for (var i = 0; i < 120; i++) { var t = rnd(i + 3), px = tailX - ux * (60 + 420 * t) + (rnd(i + 7) - 0.5) * 220 * t, py = tailY - uy * (60 + 420 * t) + (rnd(i + 11) - 0.5) * 220 * t;
  g.fillStyle = 'rgba(255,' + (190 + 50 * rnd(i)).toFixed(0) + ',120,' + (0.25 + 0.6 * (1 - t)).toFixed(2) + ')'; g.beginPath(); g.arc(px, py, 1 + 3 * rnd(i + 13) * (1 - t), 0, 6.29); g.fill(); }
// speed lines ahead/around the card
g.save(); for (var i = 0; i < 16; i++) { var o = (rnd(i + 21) - 0.5) * 360, l = 120 + 200 * rnd(i + 23), s = 120 + 260 * rnd(i + 29);
  var bx = CX - ux * s + uy * o * -1, by = CY - uy * s + ux * o; g.strokeStyle = 'rgba(200,220,255,' + (0.08 + 0.18 * rnd(i)).toFixed(2) + ')'; g.lineWidth = 2; g.beginPath(); g.moveTo(bx, by); g.lineTo(bx - ux * l, by - uy * l); g.stroke(); }
g.restore();
// the card
(function () {
  var w = SZ; g.save(); g.translate(CX, CY); g.rotate(ANG);
  g.shadowColor = 'rgba(255,210,130,0.9)'; g.shadowBlur = 60;
  g.beginPath(); g.moveTo(-w / 2, -h / 2 + w * 0.22); g.lineTo(-w / 2 + w * 0.22, -h / 2); g.lineTo(w / 2, -h / 2); g.lineTo(w / 2, h / 2); g.lineTo(-w / 2, h / 2); g.closePath();
  var gr = g.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2); gr.addColorStop(0, '#3a4a72'); gr.addColorStop(0.55, '#1c2742'); gr.addColorStop(1, '#121a2e'); g.fillStyle = gr; g.fill();
  g.shadowBlur = 24; g.strokeStyle = '#ffd27a'; g.lineWidth = 5; g.stroke(); g.shadowBlur = 0;
  g.fillStyle = '#d8b25e'; for (var i = 0; i < 7; i++) g.fillRect(-w / 2 + w * 0.2 + i * w * 0.1, -h / 2 + w * 0.06, w * 0.06, w * 0.22);
  var lb = g.createLinearGradient(0, -h * 0.05, 0, h * 0.4); lb.addColorStop(0, 'rgba(255,214,140,0.95)'); lb.addColorStop(1, 'rgba(240,170,70,0.9)');
  g.fillStyle = lb; g.fillRect(-w * 0.38, -h * 0.02, w * 0.76, h * 0.38);
  g.fillStyle = 'rgba(30,20,8,0.85)'; g.fillRect(-w * 0.3, h * 0.08, w * 0.6, h * 0.05); g.fillRect(-w * 0.3, h * 0.18, w * 0.42, h * 0.04);
  // a sheen
  var sh = g.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2); sh.addColorStop(0.3, 'rgba(255,255,255,0)'); sh.addColorStop(0.45, 'rgba(255,255,255,0.18)'); sh.addColorStop(0.6, 'rgba(255,255,255,0)');
  g.fillStyle = sh; g.beginPath(); g.moveTo(-w / 2, -h / 2 + w * 0.22); g.lineTo(-w / 2 + w * 0.22, -h / 2); g.lineTo(w / 2, -h / 2); g.lineTo(w / 2, h / 2); g.lineTo(-w / 2, h / 2); g.closePath(); g.fill();
  g.restore();
})();
var vg = g.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 1.0); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.7)'); g.fillStyle = vg; g.fillRect(0, 0, W, H);
</script></body></html>
