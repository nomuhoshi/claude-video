<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>cover</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;background:#050505;overflow:hidden}
.c{position:relative;width:1920px;height:1080px;overflow:hidden;color:#fff;font-family:"Noto Serif SC","Noto Serif CJK SC",serif}
canvas{position:absolute;left:0;top:0}
.kick{position:absolute;left:330px;top:206px;font-family:"Noto Sans SC",sans-serif;font-size:26px;color:#8f8aa6;letter-spacing:.32em}
.h{position:absolute;left:318px;top:250px;font-weight:900;font-size:96px;line-height:1.32;color:#f3efe6;letter-spacing:.02em;text-shadow:0 0 30px rgba(255,230,190,.12)}
.h b{color:#f2c66b;font-weight:900;text-shadow:0 0 28px rgba(242,198,107,.5)}
.p{position:absolute;left:326px;top:540px;font-size:50px;font-weight:900;color:#e9e3d6;letter-spacing:.03em}
.p b{color:#ffd98a;text-shadow:0 0 30px rgba(255,210,130,.7)}
.lab{position:absolute;left:330px;top:770px;font-family:"Noto Sans SC",sans-serif;font-size:24px;color:#8f8aa6;letter-spacing:.2em}
.val{position:absolute;left:324px;top:800px;font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:68px;color:#c9b8ff;letter-spacing:.02em;text-shadow:0 0 30px rgba(201,184,255,.35)}
.rule{position:absolute;left:330px;top:900px;width:420px;height:2px;background:linear-gradient(90deg,rgba(201,184,255,.6),rgba(201,184,255,0))}
</style></head><body><div class="c">
<canvas id="cv" width="1920" height="1080"></canvas>
<div class="kick">詹姆斯 · 克拉克 · 麦克斯韦</div>
<div class="h">他用一支笔，<br>算出了<b>光是什么</b></div>
<div class="p">比人类第一次抓到它，早了 <b>22</b> 年。</div>
<div class="lab">算出的速度</div>
<div class="val">310 740 km/s</div>
<div class="rule"></div>
</div>
<script>
const g=document.getElementById('cv').getContext('2d');
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function halo(x,y,r,col,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.globalAlpha=a;g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.globalAlpha=1}
let bg=g.createLinearGradient(0,0,1920,0);bg.addColorStop(0,'#050507');bg.addColorStop(.6,'#08070c');bg.addColorStop(1,'#0d0a14');g.fillStyle=bg;g.fillRect(0,0,1920,1080);
const LX=1290,LY=720;                       // the light source: where the wave is born
g.globalCompositeOperation='lighter';halo(LX,LY,620,'rgba(170,140,255,.16)',1);halo(LX,LY,260,'rgba(255,220,170,.22)',1);g.globalCompositeOperation='source-over';
// the bearded figure, dotted, lit from the wave in front of him
const m=document.createElement('canvas');m.width=1920;m.height=1080;const k=m.getContext('2d');k.fillStyle='#fff';
k.beginPath();k.ellipse(1470,400,95,118,0,0,7);k.fill();
k.fillRect(1430,560,80,60);k.beginPath();k.moveTo(1380,430);k.quadraticCurveTo(1385,560,1470,585);k.quadraticCurveTo(1555,560,1560,430);k.closePath();k.fill();   // beard
k.beginPath();k.moveTo(1230,990);k.quadraticCurveTo(1236,640,1470,600);k.quadraticCurveTo(1704,640,1710,990);k.closePath();k.fill();
const md=k.getImageData(0,0,1920,1080).data;const r=rng(9),S=9;
for(let y=270;y<990;y+=S)for(let x=1210;x<1730;x+=S){
 const xx=x+((y/S)%2?S/2:0);const a=md[(y*1920+Math.round(xx))*4+3];if(a<40)continue;
 const d=Math.hypot(xx-LX,y-LY),lit=Math.max(0,1-d/520),rad=1.0+2.7*lit*(0.7+0.3*r());
 const c=`rgba(${Math.round(200+55*lit)},${Math.round(190+40*lit)},255,${(0.25+0.75*lit).toFixed(2)})`;
 g.fillStyle=c;g.beginPath();g.arc(xx,y,rad,0,7);g.fill();
}
// an electromagnetic wave: electric field (warm) and magnetic field (cool), running off to the left and turning into a spectrum
g.lineWidth=4;g.lineCap='round';
function wave(col,amp,phase,skew){g.strokeStyle=col;g.beginPath();for(let i=0;i<=150;i++){const x=LX-40-i*1.6,f=Math.min(1,i/60),y=LY+Math.sin(i*0.11+phase)*amp*f+skew*Math.sin(i*0.11+phase)*f;if(i===0)g.moveTo(x,y);else g.lineTo(x,y)}g.stroke()}
g.globalAlpha=.85;wave('rgba(255,157,110,0.95)',55,0,0);g.globalAlpha=.7;wave('rgba(143,208,255,0.9)',0,0,24);g.globalAlpha=1;
g.globalCompositeOperation='lighter';halo(LX-40,LY,80,'rgba(255,240,210,.9)',.8);g.globalCompositeOperation='source-over';
// a thin spectrum along the bottom right
const sp=g.createLinearGradient(1120,0,1720,0);['#8a5cff','#4f8cff','#4fd08a','#ffe04f','#ff9a3c','#ff4f4f'].forEach((c,i)=>sp.addColorStop(i/5,c));g.fillStyle=sp;g.globalAlpha=.85;g.fillRect(1120,1005,600,6);g.globalAlpha=1;
const v=g.createRadialGradient(1100,540,420,1000,540,1150);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');g.fillStyle=v;g.fillRect(0,0,1920,1080);
</script></body></html>
