<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>cover</title>
<style>
:root{--ink:#06080d;--ink2:#0d121b;--fg:#eef2f8;--dim:#93a1b6;--gold:#f2c66b;--ice:#8fd0ff;--line:rgba(190,210,235,.18)}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;background:var(--ink);overflow:hidden}
.c{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:"Noto Sans SC","Noto Sans CJK SC",sans-serif;color:var(--fg);
 background:radial-gradient(900px 600px at 6% 108%,rgba(242,198,107,.22),transparent 70%),radial-gradient(900px 640px at 98% -8%,rgba(143,208,255,.20),transparent 70%),var(--ink2)}
.vl{position:absolute;left:50%;top:0;bottom:0;width:2px;background:linear-gradient(transparent,rgba(143,208,255,.55) 30%,rgba(143,208,255,.55) 70%,transparent)}
.tag{position:absolute;left:240px;top:64px;font:500 34px "IBM Plex Mono",monospace;letter-spacing:.2em;color:var(--dim)}
.tag b{color:var(--gold);font-weight:500}
.t1{position:absolute;left:240px;top:150px;font:900 150px/1 "Noto Serif SC","Noto Serif CJK SC",serif;color:var(--fg);letter-spacing:.02em}
.t2{position:absolute;left:240px;top:318px;font:900 250px/1.05 "Noto Serif SC","Noto Serif CJK SC",serif;letter-spacing:.01em;
 background:linear-gradient(90deg,#ffe3a0 0%,#f2c66b 48%,#bfe4ff 52%,#8fd0ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(242,198,107,.35))}
.t3{position:absolute;left:244px;top:610px;font:900 92px/1.1 "Noto Sans SC","Noto Sans CJK SC",sans-serif;color:var(--ice)}
.t3 em{font-style:normal;color:var(--gold)}
.num{position:absolute;left:240px;bottom:64px;display:flex;align-items:baseline;gap:30px}
.num .u{font:900 56px "Noto Serif SC","Noto Serif CJK SC",serif;color:var(--gold)}
.num .n{font:900 150px/1 "Noto Serif SC","Noto Serif CJK SC",serif;color:var(--gold);text-shadow:0 0 40px rgba(242,198,107,.35)}
.num .y{font:900 56px "Noto Serif SC","Noto Serif CJK SC",serif;color:var(--fg)}
.chip{margin-left:40px;align-self:center;padding:18px 38px;border:2px solid var(--line);border-radius:99px;background:rgba(6,8,13,.6);font:900 54px "Noto Sans SC","Noto Sans CJK SC",sans-serif}
.chip small{font:500 32px "IBM Plex Mono",monospace;color:var(--dim);margin-right:18px;letter-spacing:.08em}
.chip b{color:var(--ice)}
</style></head><body><div class="c">
<i class="vl"></i>
<div class="tag"><b>美股</b> · 半导体 · 财报前瞻</div>
<div class="t1">台积电三季报</div>
<div class="t2">营收创新高</div>
<div class="t3">但<em>利润率</em>才是关键</div>
<div class="num"><span class="u">US$</span><span class="n">467.1</span><span class="y">亿</span><div class="chip"><small>同比</small><b>+51%</b></div></div>
</div></body></html>
